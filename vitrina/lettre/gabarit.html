<!-- =====================================================================
     MINUIT · le gabarit de la lettre
     NEBULA Agency

     LA PHRASE, ET TOUT EN DÉCOULE :
     une lettre, c'est du papier qu'on a plié, scellé, et qu'on ouvre en
     tremblant. Papier, cire, encre, pli. Aucune animation de cette page ne
     vient d'ailleurs, et aucune ne pourrait être recopiée chez un autre
     client sans mentir.

     ⚠️ CE FICHIER EST AUTONOME. Il part entier dans Cloudflare KV et se sert
     depuis le bord du réseau, sans jamais réveiller un serveur : une page
     qu'on ouvre à minuit ne peut pas attendre. Donc AUCUNE image externe,
     aucune bibliothèque, et la police manuscrite est embarquée en base64.
     Tout le reste est en CSS. Seul EB Garamond vient encore du dehors, et
     Georgia le remplace sans que la lettre y perde.

     ⛔ AUCUNE PHOTO INVENTÉE. Sans photo réelle, le cadre reste vide et le
     dit. Fabriquer un visage à la place d'un vrai visage, sur un cadeau
     intime, serait une trahison du produit.

     POUR PERSONNALISER : tout est dans le bloc LETTRE, en bas du fichier.
     ===================================================================== -->

<style>
:root{
  --nuit:#2b0d14;        /* l'enveloppe fermée */
  --nuit-2:#3d141d;
  --papier:#f2e9dc;      /* le papier de la lettre */
  --papier-2:#e7dac6;
  --encre:#2e2620;       /* jamais du noir : de l'encre brune */
  --encre-2:#6a5c4e;
  --cire:#8e2233;        /* la cire du cachet */
  --cire-clair:#a8394a;
  --or:#9c7735;          /* l'or du cachet, assez foncé pour porter du texte */
  --or-clair:#d3ae68;
  --or-vif:#c9a35c;
  --serif:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --script:"Petit Formal Script","Snell Roundhand",cursive;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--nuit);color:var(--encre);
  font-family:var(--serif);font-size:19px;line-height:1.66;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body.ferme{overflow:hidden;height:100vh}

/* ---------- grain du papier, en CSS, sans image ---------- */
.grain{
  position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.5;
  background:
    radial-gradient(circle at 15% 22%,rgba(120,95,60,.05) 0 1px,transparent 1px),
    radial-gradient(circle at 72% 61%,rgba(120,95,60,.045) 0 1px,transparent 1px),
    radial-gradient(circle at 41% 84%,rgba(120,95,60,.04) 0 1px,transparent 1px);
  background-size:41px 41px,67px 67px,93px 93px;
}

/* =====================================================================
   1 · LE SEUIL : l'enveloppe et le cachet de cire
   Signature : le cachet se fend en deux et l'enveloppe s'ouvre.
   ===================================================================== */
#seuil{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:
    radial-gradient(ellipse at 50% 38%,var(--nuit-2) 0%,var(--nuit) 62%),
    var(--nuit);
  transition:opacity .9s ease,visibility .9s;
}
#seuil.parti{opacity:0;visibility:hidden}
.env-zone{display:flex;flex-direction:column;align-items:center;gap:34px;padding:24px}

.enveloppe{
  position:relative;width:min(78vw,330px);aspect-ratio:1.5/1;
  background:linear-gradient(168deg,#6d1b26,#571019);
  border-radius:5px;
  box-shadow:0 30px 70px -18px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.09);
  cursor:pointer;border:none;padding:0;
  transition:transform .8s cubic-bezier(.25,1,.5,1);
}
.enveloppe:focus-visible{outline:2px solid var(--or-vif);outline-offset:6px}
/* les deux pans du bas, qui donnent le pli */
.enveloppe::before{
  content:"";position:absolute;inset:0;border-radius:5px;
  background:
    linear-gradient(to bottom right,transparent 49.6%,rgba(0,0,0,.16) 50%),
    linear-gradient(to bottom left,transparent 49.6%,rgba(0,0,0,.16) 50%);
}
/* le rabat */
.rabat{
  position:absolute;left:0;right:0;top:0;height:56%;
  background:linear-gradient(180deg,#7b1f2b,#63151f);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;transform:rotateX(0deg);
  transition:transform .95s cubic-bezier(.6,-.2,.3,1.3);
  z-index:3;border-radius:5px 5px 0 0;
}
.ouvert .rabat{transform:rotateX(178deg)}

/* le cachet de cire */
.cachet{
  position:absolute;left:50%;top:56%;translate:-50% -50%;z-index:5;
  width:74px;height:74px;
}
.demi{
  position:absolute;inset:0;
  background:radial-gradient(circle at 36% 30%,var(--or-clair),var(--or) 58%,#6f5323 100%);
  box-shadow:0 5px 14px rgba(0,0,0,.5);
  transition:transform .85s cubic-bezier(.35,1.2,.4,1),opacity .85s;
  border-radius:50%;
}
/* bord irrégulier de la cire, fait au clip-path */
.demi{clip-path:polygon(50% 0,68% 5%,84% 16%,95% 32%,100% 50%,95% 68%,84% 84%,68% 95%,50% 100%,32% 95%,16% 84%,5% 68%,0 50%,5% 32%,16% 16%,32% 5%)}
.demi.g{clip-path:polygon(50% 0,50% 100%,32% 95%,16% 84%,5% 68%,0 50%,5% 32%,16% 16%,32% 5%)}
.demi.d{clip-path:polygon(50% 0,68% 5%,84% 16%,95% 32%,100% 50%,95% 68%,84% 84%,68% 95%,50% 100%)}
.ouvert .demi.g{transform:translate(-46px,26px) rotate(-38deg);opacity:0}
.ouvert .demi.d{transform:translate(46px,26px) rotate(38deg);opacity:0}
.initiale{
  position:absolute;inset:0;display:grid;place-items:center;z-index:6;
  font-family:var(--script);font-size:31px;color:#5a4319;
  text-shadow:0 1px 0 rgba(255,255,255,.28);
  transition:opacity .4s;
}
.ouvert .initiale{opacity:0}

/* le papier qui glisse hors de l'enveloppe */
.glisse{
  position:absolute;left:8%;right:8%;top:14%;height:74%;
  background:linear-gradient(180deg,var(--papier),var(--papier-2));
  border-radius:3px;z-index:2;opacity:0;
  transform:translateY(0) scale(.97);
  box-shadow:0 -6px 20px rgba(0,0,0,.25);
}
.ouvert .glisse{
  animation:sortir 1.15s .45s cubic-bezier(.25,1,.5,1) forwards;
}
@keyframes sortir{
  0%{opacity:1;transform:translateY(0) scale(.97)}
  100%{opacity:1;transform:translateY(-62%) scale(1)}
}

.touche{
  font-family:var(--sans);font-size:12px;letter-spacing:.28em;text-transform:uppercase;
  color:#d9b48c;opacity:.92;
}
.touche i{display:inline-block;font-style:normal;animation:respire 2.4s ease-in-out infinite}
@keyframes respire{0%,100%{opacity:.45}50%{opacity:1}}
.pour-qui{
  font-family:var(--script);font-size:clamp(30px,8vw,44px);color:var(--or-clair);
  text-align:center;line-height:1.15;
}
.pour-qui small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:#c99a72;opacity:.8;margin-bottom:10px}

/* =====================================================================
   2 · LE CODE : l'encre qui refuse
   Signature : les points se remplissent d'encre, et la carte tremble.
   ===================================================================== */
#code{
  position:fixed;inset:0;z-index:52;display:none;place-items:center;padding:22px;
  background:radial-gradient(ellipse at 50% 40%,var(--nuit-2),var(--nuit) 65%);
}
#code.la{display:grid}
#code.parti{opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
.carte-code{
  width:min(92vw,340px);background:linear-gradient(180deg,var(--papier),var(--papier-2));
  border-radius:9px;padding:30px 26px 26px;text-align:center;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.7);
}
.carte-code.faux{animation:tremble .5s}
@keyframes tremble{
  10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}
  50%{transform:translateX(-7px)}
}
.carte-code h2{font-family:var(--script);font-size:27px;margin:0 0 4px;color:var(--cire);font-weight:400}
.indice{font-size:15px;color:var(--encre-2);margin:0 0 20px;font-style:italic}
.points{display:flex;gap:13px;justify-content:center;margin-bottom:22px}
.points i{
  width:13px;height:13px;border-radius:50%;border:1.5px solid var(--encre-2);
  transition:background .25s,border-color .25s,transform .25s;
}
.points i.plein{background:var(--encre);border-color:var(--encre);transform:scale(1.14)}
.faux .points i.plein{background:var(--cire);border-color:var(--cire)}
.clavier{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.clavier button{
  font-family:var(--serif);font-size:22px;color:var(--encre);
  background:rgba(46,38,32,.05);border:1px solid rgba(46,38,32,.14);
  border-radius:8px;min-height:52px;cursor:pointer;transition:background .15s;
}
.clavier button:hover{background:rgba(46,38,32,.11)}
.clavier button:focus-visible{outline:2px solid var(--cire);outline-offset:2px}
.clavier button.vide{visibility:hidden}

/* =====================================================================
   3 · LA LETTRE
   Signature : l'encre s'écrit, ligne après ligne.
   ===================================================================== */
main{position:relative;z-index:1;background:var(--papier);}
.feuille{max-width:660px;margin:0 auto;padding:0 26px}
section{padding:78px 0;position:relative}
section+section{border-top:1px solid rgba(46,38,32,.1)}

.entete{text-align:center;padding-top:96px}
.accueil{
  font-family:var(--script);font-size:clamp(27px,7vw,40px);color:var(--cire);
  line-height:1.28;margin:0 0 12px;
}
.filet{width:64px;height:1px;background:var(--or);margin:26px auto;opacity:.7}
.rubrique{
  font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--or);margin:0 0 22px;text-align:center;
}
.lettre p{margin:0 0 1.15em;text-align:left}
/* chaque ligne se dévoile comme si on l'écrivait */
.ligne{display:block;overflow:hidden}
.ligne span{
  display:inline-block;
  transform:translateY(105%);
  transition:transform .85s cubic-bezier(.22,1,.36,1);
}
.vu .ligne span{transform:translateY(0)}
.lettre .ligne:nth-child(1) span{transition-delay:.05s}
.lettre .ligne:nth-child(2) span{transition-delay:.16s}
.lettre .ligne:nth-child(3) span{transition-delay:.27s}
.lettre .ligne:nth-child(4) span{transition-delay:.38s}
.lettre .ligne:nth-child(5) span{transition-delay:.49s}
.lettre .ligne:nth-child(6) span{transition-delay:.6s}

.signature{
  font-family:var(--script);font-size:30px;color:var(--cire);
  text-align:right;margin-top:34px;opacity:0;transform:translateY(10px);
  transition:opacity .9s .7s,transform .9s .7s;
}
.vu .signature{opacity:1;transform:none}

/* =====================================================================
   4 · LES PETITS MOTS
   Signature : des papiers pliés qui se déplient, un par un.
   ===================================================================== */
.mots{display:flex;flex-direction:column;gap:13px;list-style:none;padding:0;margin:0}
.mots li{
  background:linear-gradient(180deg,#fbf6ee,var(--papier-2));
  border:1px solid rgba(46,38,32,.12);border-radius:4px;
  padding:16px 20px;font-size:18px;
  transform-origin:top center;transform:perspective(700px) rotateX(-88deg);
  opacity:0;transition:transform .75s cubic-bezier(.3,1.2,.4,1),opacity .5s;
  box-shadow:0 3px 10px rgba(46,38,32,.07);
}
.vu .mots li{transform:perspective(700px) rotateX(0);opacity:1}
.vu .mots li:nth-child(2){transition-delay:.12s}
.vu .mots li:nth-child(3){transition-delay:.24s}
.vu .mots li:nth-child(4){transition-delay:.36s}
.vu .mots li:nth-child(5){transition-delay:.48s}
.vu .mots li:nth-child(6){transition-delay:.6s}

/* =====================================================================
   5 · NOS PHOTOS
   Signature : les polaroïds tombent et se posent de travers.
   ===================================================================== */
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:20px;margin:0;padding:0;list-style:none}
.pola{
  background:#fffdf8;padding:11px 11px 14px;border-radius:2px;
  display:flex;flex-direction:column;gap:9px;
  box-shadow:0 8px 22px rgba(46,38,32,.16);
  opacity:0;transform:translateY(-26px) rotate(0deg);
  transition:opacity .6s,transform .8s cubic-bezier(.3,1.3,.5,1);
  position:relative;
}
.vu .pola{opacity:1}
.vu .pola:nth-child(odd){transform:translateY(0) rotate(-2.2deg)}
.vu .pola:nth-child(even){transform:translateY(0) rotate(1.8deg)}
.vu .pola:nth-child(2){transition-delay:.1s}
.vu .pola:nth-child(3){transition-delay:.2s}
.vu .pola:nth-child(4){transition-delay:.3s}
.pola img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--papier-2)}
/* ⛔ Pas de photo = un cadre vide qui le DIT. On n'invente jamais un visage. */
.vide{
  width:100%;aspect-ratio:1;display:grid;place-items:center;
  background:repeating-linear-gradient(45deg,#efe7da,#efe7da 9px,#e8dfd0 9px,#e8dfd0 18px);
  color:var(--encre-2);font-family:var(--sans);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;text-align:center;padding:12px;
}
.pola figcaption{
  font-family:var(--script);font-size:19px;color:var(--encre);
  text-align:center;line-height:1.25;
  /* ⚠️ Pas de troncature. Une légende coupée en plein mot (« Notre premi… »)
     sur la photo d'un cadeau est pire que pas de légende du tout. Elle passe
     à la ligne, et la hauteur du polaroïd suit. */
  overflow-wrap:break-word;
}

/* =====================================================================
   6 · NOTRE MUSIQUE
   Signature : le sillon du disque qui tourne.
   ===================================================================== */
.musiques{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.musiques li{border-bottom:1px solid rgba(46,38,32,.1)}
.musiques li:last-child{border-bottom:none}
.piste{
  display:flex;align-items:center;gap:15px;padding:14px 4px;
  color:var(--encre);text-decoration:none;
  opacity:0;transform:translateX(-12px);
  transition:opacity .6s,transform .6s;
}
.vu .piste{opacity:1;transform:none}
.vu li:nth-child(2) .piste{transition-delay:.1s}
.vu li:nth-child(3) .piste{transition-delay:.2s}
.vu li:nth-child(4) .piste{transition-delay:.3s}
.disque{
  width:34px;height:34px;border-radius:50%;flex:none;
  background:
    radial-gradient(circle,var(--papier) 0 12%,transparent 12%),
    repeating-radial-gradient(circle,var(--encre) 0 1px,#4a3f35 1px 3px);
}
.piste:hover .disque,.piste:focus-visible .disque{animation:tourne 3.4s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.piste b{display:block;font-weight:600;font-size:18px}
.piste span{display:block;font-size:15px;color:var(--encre-2)}

/* =====================================================================
   7 · LA QUESTION
   Signature : le « Non » qui s'enfuit, et se moque en s'enfuyant.
   ===================================================================== */
.question{text-align:center}
.question h2{font-family:var(--script);font-size:clamp(28px,7vw,40px);color:var(--cire);font-weight:400;margin:0 0 30px}
.duo{position:relative;min-height:172px;display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}
.bouton{
  font-family:var(--serif);font-size:19px;padding:13px 34px;border-radius:3px;
  border:1px solid var(--cire);cursor:pointer;min-height:48px;min-width:112px;
  transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .2s;
}
.oui{background:var(--cire);color:#fff8f2;border-color:var(--cire)}
.oui:hover{background:var(--cire-clair)}
.non{background:transparent;color:var(--cire)}
.non.fuit{position:absolute}
.raillerie{
  font-size:16px;color:var(--encre-2);font-style:italic;margin-top:18px;min-height:1.6em;
  transition:opacity .3s;
}
.reponse{
  font-family:var(--script);font-size:clamp(26px,6.4vw,36px);color:var(--cire);
  margin-top:8px;opacity:0;transform:scale(.94);transition:opacity .7s,transform .7s;
}
.reponse.la{opacity:1;transform:none}

/* le pli final */
.fin{text-align:center;padding-bottom:104px}
.pli{
  width:min(100%,320px);height:1px;margin:0 auto 30px;
  background:linear-gradient(90deg,transparent,var(--or),transparent);
}
.pied{
  font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--encre-2);opacity:.68;text-decoration:none;display:inline-block;padding:10px;
}
.pied:hover{opacity:1;color:var(--cire)}

/* barre discrète de navigation */
.sommaire{
  position:sticky;top:0;z-index:20;background:rgba(242,233,220,.94);
  backdrop-filter:blur(6px);border-bottom:1px solid rgba(46,38,32,.1);
  display:flex;gap:4px;justify-content:center;padding:9px 8px;overflow-x:auto;
}
.sommaire a{
  font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--encre-2);text-decoration:none;padding:0 12px;border-radius:3px;white-space:nowrap;
  /* 44px de haut : on lit cette lettre au pouce, sur un téléphone. */
  min-height:44px;display:inline-flex;align-items:center;
}
.sommaire a:hover,.sommaire a:focus-visible{color:var(--cire);background:rgba(142,34,51,.07)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .ligne span,.mots li,.pola,.piste{transform:none!important;opacity:1!important}
  .glisse{opacity:1!important}
}
</style>
</head>
<body class="ferme">

<div class="grain" aria-hidden="true"></div>

<!-- ===================== 1 · LE SEUIL ===================== -->
<div id="seuil">
  <div class="env-zone">
    <p class="pour-qui"><small id="mention">Une lettre pour</small><span id="destinataire">toi</span></p>
    <button class="enveloppe" id="enveloppe" aria-label="Ouvrir l'enveloppe">
      <span class="glisse" aria-hidden="true"></span>
      <span class="rabat" aria-hidden="true"></span>
      <span class="cachet" aria-hidden="true">
        <span class="demi g"></span><span class="demi d"></span>
        <span class="initiale" id="initiale">M</span>
      </span>
    </button>
    <p class="touche"><i>Touche le cachet</i></p>
  </div>
</div>

<!-- ===================== 2 · LE CODE ===================== -->
<div id="code">
  <div class="carte-code" id="carteCode">
    <h2>Le code secret</h2>
    <p class="indice" id="indice"></p>
    <div class="points" id="points" aria-hidden="true"></div>
    <div class="clavier" id="clavier"></div>
  </div>
</div>

<!-- ===================== LA LETTRE ===================== -->
<main id="lettre" hidden>
  <nav class="sommaire" aria-label="Sommaire">
    <a href="#s-lettre">La lettre</a>
    <a href="#s-mots">Mes mots</a>
    <a href="#s-photos">Nos photos</a>
    <a href="#s-musique">Notre musique</a>
  </nav>

  <div class="feuille">
    <section class="entete">
      <p class="accueil" id="accueil"></p>
      <div class="filet"></div>
    </section>

    <section id="s-lettre" class="anim">
      <p class="rubrique">La lettre</p>
      <div class="lettre" id="corps"></div>
      <p class="signature" id="signature"></p>
    </section>

    <section id="s-mots" class="anim" hidden>
      <p class="rubrique">Mes mots pour toi</p>
      <ul class="mots" id="listeMots"></ul>
    </section>

    <section id="s-photos" class="anim" hidden>
      <p class="rubrique">Nos photos</p>
      <ul class="photos" id="listePhotos"></ul>
    </section>

    <section id="s-musique" class="anim" hidden>
      <p class="rubrique">Notre musique</p>
      <ul class="musiques" id="listeMusiques"></ul>
    </section>

    <section id="s-question" class="anim question" hidden>
      <h2 id="qTexte"></h2>
      <div class="duo" id="duo">
        <button class="bouton oui" id="bOui"></button>
        <button class="bouton non" id="bNon"></button>
      </div>
      <p class="raillerie" id="raillerie"></p>
      <p class="reponse" id="reponse"></p>
    </section>

    <section class="fin">
      <div class="pli"></div>
      <a class="pied" id="pied" href="#">Créer la mienne sur Minuit</a>
    </section>
  </div>
</main>

<script>
/* =====================================================================
   LE CONTENU. C'est la seule partie qui change d'une lettre à l'autre.
   Le back-office écrira ce bloc, rien d'autre.
   ===================================================================== */
/* <<<MINUIT:DEBUT_CONTENU>>> */
const LETTRE = {
  pour: "Ama",
  de: "Koffi",
  initiale: "K",

  // Code secret. Chaîne vide = pas de code, on entre directement.
  code: "0410",
  indice: "Le jour où on s'est vus, jour et mois.",

  accueil: "Bienvenue mon amour, prends ton temps.",

  corps: [
    "Je ne sais pas écrire les choses comme il faut, alors je les écris comme elles viennent.",
    "Depuis le premier jour, tu as cette manière de rendre les journées ordinaires moins ordinaires. Je ne te l'ai jamais dit correctement, et j'ai pensé qu'une page valait mieux qu'un message de plus.",
    "Il n'y a rien à acheter ici, rien à faire. Juste toi, quelques mots, et le temps que tu veux bien leur donner."
  ],
  signature: "Pour toujours, Koffi",

  mots: [
    "Mange à l'heure, même quand tu es occupée.",
    "Écris-moi quand tu es arrivée.",
    "Tu es plus forte que ce que tu crois.",
    "Tu es à moi, et je suis à toi."
  ],

  // ⛔ Aucune photo inventée. Un cadre sans photo le dit, et c'est très bien.
  photos: [
    { src: "", legende: "Notre premier jour" },
    { src: "", legende: "Toi, un dimanche" },
    { src: "", legende: "Nous" }
  ],

  musiques: [
    { titre: "Ton morceau", artiste: "Celui qu'on écoutait", lien: "" },
    { titre: "Le nôtre", artiste: "Celui de la voiture", lien: "" }
  ],

  question: {
    texte: "Tu m'aimes encore ?",
    oui: "Oui",
    non: "Non",
    railleries: [
      "Essaie encore.",
      "Il bouge, ce bouton.",
      "Tu vois bien que non.",
      "Vraiment ?",
      "Ce bouton ne marche pas, c'est comme ça.",
      "Abandonne, tu m'aimes."
    ],
    reponse: "Je le savais."
  },

  // Le pied de page viral. Laisser vide pour l'enlever (formule payante).
  signaturePied: "Créer la mienne sur Minuit",
  lienPied: ""
};
/* <<<MINUIT:FIN_CONTENU>>> */

/* ===================================================================== */
(function(){
  "use strict";
  const $ = (s) => document.querySelector(s);
  const doux = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- le seuil ---------- */
  $("#destinataire").textContent = LETTRE.pour || "toi";
  $("#initiale").textContent = (LETTRE.initiale || (LETTRE.de || "M")[0] || "M").toUpperCase();

  const seuil = $("#seuil"), enveloppe = $("#enveloppe");
  let ouverte = false;

  function ouvrir(){
    if (ouverte) return;
    ouverte = true;
    enveloppe.classList.add("ouvert");
    enveloppe.disabled = true;
    // On laisse la cire se fendre et le papier sortir avant d'enchaîner.
    setTimeout(passerAuCode, doux ? 60 : 1500);
  }
  enveloppe.addEventListener("click", ouvrir);

  /* ---------- le code ---------- */
  const boiteCode = $("#code"), carte = $("#carteCode");
  const attendu = String(LETTRE.code || "");
  let saisie = "";

  function dessinerPoints(){
    const p = $("#points");
    p.innerHTML = "";
    for (let i = 0; i < attendu.length; i++){
      const d = document.createElement("i");
      if (i < saisie.length) d.className = "plein";
      p.appendChild(d);
    }
  }

  function passerAuCode(){
    if (!attendu){ entrer(); return; }
    seuil.classList.add("parti");
    boiteCode.classList.add("la");
    $("#indice").textContent = LETTRE.indice || "";
    dessinerPoints();
    const cl = $("#clavier");
    ["1","2","3","4","5","6","7","8","9","","0","<"].forEach(t => {
      const b = document.createElement("button");
      b.type = "button";
      if (!t){ b.className = "vide"; b.tabIndex = -1; b.setAttribute("aria-hidden","true"); }
      b.textContent = t;
      b.addEventListener("click", () => taper(t));
      cl.appendChild(b);
    });
    setTimeout(() => { const p = cl.querySelector("button:not(.vide)"); if (p) p.focus(); }, 400);
  }

  function taper(t){
    if (!t) return;
    if (t === "<"){ saisie = saisie.slice(0, -1); dessinerPoints(); return; }
    if (saisie.length >= attendu.length) return;
    saisie += t;
    dessinerPoints();
    if (saisie.length === attendu.length){
      if (saisie === attendu){
        setTimeout(() => { boiteCode.classList.add("parti"); setTimeout(entrer, 620); }, 220);
      } else {
        carte.classList.add("faux");
        setTimeout(() => { carte.classList.remove("faux"); saisie = ""; dessinerPoints(); }, 620);
      }
    }
  }

  /* ---------- on entre dans la lettre ---------- */
  function entrer(){
    seuil.classList.add("parti");
    document.body.classList.remove("ferme");
    $("#lettre").hidden = false;
    setTimeout(() => { seuil.style.display = "none"; boiteCode.style.display = "none"; }, 900);
    reveler();
  }

  /* ---------- le contenu ---------- */
  $("#accueil").textContent = LETTRE.accueil || "";

  // Chaque paragraphe est découpé en lignes qui montent : l'encre s'écrit.
  const corps = $("#corps");
  (LETTRE.corps || []).forEach(txt => {
    const p = document.createElement("p");
    const l = document.createElement("span");
    l.className = "ligne";
    const s = document.createElement("span");
    s.textContent = txt;
    l.appendChild(s); p.appendChild(l);
    corps.appendChild(p);
  });
  $("#signature").textContent = LETTRE.signature || "";

  const mots = (LETTRE.mots || []).filter(Boolean);
  if (mots.length){
    $("#s-mots").hidden = false;
    mots.forEach(m => {
      const li = document.createElement("li");
      li.textContent = m;
      $("#listeMots").appendChild(li);
    });
  }

  const photos = (LETTRE.photos || []).filter(p => p && (p.src || p.legende));
  if (photos.length){
    $("#s-photos").hidden = false;
    photos.forEach(ph => {
      const li = document.createElement("li");
      const fig = document.createElement("figure");
      fig.className = "pola";
      fig.style.margin = "0";
      if (ph.src){
        const im = document.createElement("img");
        im.src = ph.src;
        im.alt = ph.legende || "";
        im.loading = "lazy";
        fig.appendChild(im);
      } else {
        // ⛔ Jamais d'image inventée : le cadre reste vide et le dit.
        const v = document.createElement("div");
        v.className = "vide";
        v.textContent = "Ta photo ici";
        fig.appendChild(v);
      }
      if (ph.legende){
        const c = document.createElement("figcaption");
        c.textContent = ph.legende;
        fig.appendChild(c);
      }
      li.appendChild(fig);
      $("#listePhotos").appendChild(li);
    });
  }

  const musiques = (LETTRE.musiques || []).filter(m => m && m.titre);
  if (musiques.length){
    $("#s-musique").hidden = false;
    musiques.forEach(mu => {
      const li = document.createElement("li");
      const a = document.createElement(mu.lien ? "a" : "div");
      a.className = "piste";
      if (mu.lien){ a.href = mu.lien; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      const d = document.createElement("span"); d.className = "disque"; d.setAttribute("aria-hidden","true");
      const t = document.createElement("span");
      const b = document.createElement("b"); b.textContent = mu.titre;
      const s = document.createElement("span"); s.textContent = mu.artiste || "";
      t.appendChild(b); t.appendChild(s);
      a.appendChild(d); a.appendChild(t);
      li.appendChild(a);
      $("#listeMusiques").appendChild(li);
    });
  }

  /* ---------- la question, et le Non qui s'enfuit ---------- */
  const Q = LETTRE.question;
  if (Q && Q.texte){
    $("#s-question").hidden = false;
    $("#qTexte").textContent = Q.texte;
    const oui = $("#bOui"), non = $("#bNon"), duo = $("#duo");
    oui.textContent = Q.oui || "Oui";
    non.textContent = Q.non || "Non";
    let n = 0;

    function fuir(){
      const zone = duo.getBoundingClientRect();
      const b = non.getBoundingClientRect();
      const o = oui.getBoundingClientRect();
      // On garde le bouton ENTIÈREMENT dans la zone : un bouton qui sort de
      // l'écran sur un téléphone n'est pas drôle, il casse la page.
      const maxX = Math.max(0, zone.width - b.width);
      const maxY = Math.max(0, zone.height - b.height);

      // ⚠️ ET SURTOUT : il ne doit JAMAIS se poser SUR le « Oui ».
      // Sans cette interdiction, le Non finit par recouvrir le Oui et on ne
      // peut plus répondre du tout : le gag tuerait la page. Mesuré : ça
      // arrivait en quelques survols.
      const marge = 12;
      const ix1 = o.left  - zone.left - b.width - marge;
      const ix2 = o.right - zone.left + marge;
      const iy1 = o.top   - zone.top  - b.height - marge;
      const iy2 = o.bottom - zone.top + marge;
      const dessus = (x, y) => x > ix1 && x < ix2 && y > iy1 && y < iy2;

      let x = 0, y = 0, essais = 0;
      do {
        x = Math.random() * maxX;
        y = Math.random() * maxY;
        essais++;
      } while (essais < 60 && dessus(x, y));

      // Si la zone est trop étroite pour esquiver, on se colle dans le coin
      // le plus éloigné du Oui plutôt que de se poser dessus.
      if (dessus(x, y)){
        x = (o.left - zone.left) > zone.width / 2 ? 0 : maxX;
        y = (o.top - zone.top) > zone.height / 2 ? 0 : maxY;
      }

      non.classList.add("fuit");
      non.style.left = Math.round(x) + "px";
      non.style.top  = Math.round(y) + "px";
      const r = Q.railleries || [];
      if (r.length){ $("#raillerie").textContent = r[n % r.length]; n++; }
    }
    // Sur un ordinateur il fuit au survol, sur un téléphone il fuit au toucher.
    non.addEventListener("mouseenter", fuir);
    non.addEventListener("focus", fuir);
    non.addEventListener("click", (e) => { e.preventDefault(); fuir(); });

    oui.addEventListener("click", () => {
      $("#reponse").textContent = Q.reponse || "";
      $("#reponse").classList.add("la");
      $("#raillerie").textContent = "";
      non.style.display = "none";
      oui.disabled = true;
    });
  }

  /* ---------- le pied viral ---------- */
  const pied = $("#pied");
  if (LETTRE.signaturePied){
    pied.textContent = LETTRE.signaturePied;
    if (LETTRE.lienPied){ pied.href = LETTRE.lienPied; } else { pied.removeAttribute("href"); }
  } else {
    pied.remove();
  }

  /* ---------- les révélations au défilement ---------- */
  function reveler(){
    const cibles = document.querySelectorAll("section.anim");
    if (doux || !("IntersectionObserver" in window)){
      cibles.forEach(s => s.classList.add("vu"));
      return;
    }
    const o = new IntersectionObserver((entrees) => {
      entrees.forEach(e => {
        if (e.isIntersecting){ e.target.classList.add("vu"); o.unobserve(e.target); }
      });
    }, { threshold: 0.16, rootMargin: "0px 0px -8% 0px" });
    cibles.forEach(s => o.observe(s));
  }

  // Le titre de l'onglet porte le prénom : c'est ce qu'on voit dans WhatsApp.
  if (LETTRE.pour) document.title = "Une lettre pour " + LETTRE.pour;
})();
</script>
