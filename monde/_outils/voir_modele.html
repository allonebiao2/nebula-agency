<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voir un modèle</title>
<style>html,body{margin:0;height:100%;background:#d9d9d9;overflow:hidden}canvas{display:block}#info{position:fixed;left:10px;top:8px;font:13px system-ui;color:#333}</style>
<script type="importmap">{ "imports": { "three": "../socle/vendor/three/three.module.min.js", "three/addons/": "../socle/vendor/three/addons/" } }</script>
</head>
<body>
<div id="info"></div>
<script type="module">
/* LE MONDE · regarder un modèle 3D sous plusieurs angles avant de le poser dans un lieu.
   ?f=chemin/vers/modele.glb&angle=0  (angle en degrés autour du modèle) */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.AgXToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd9d9d9);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
const pm = new THREE.PMREMGenerator(r);
new HDRLoader().load('../socle/ressources/polyhaven/photo_studio_loft_hall/eclairage_1k.hdr', (h) => { scene.environment = pm.fromEquirectangular(h).texture; });
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.6));
new GLTFLoader().load(q.get('f'), (g) => {
  const o = g.scene; scene.add(o);
  const b = new THREE.Box3().setFromObject(o), t = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  let tri = 0; o.traverse(m => { if (m.isMesh) tri += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; });
  const a = (parseFloat(q.get('angle') || '0')) * Math.PI / 180, d = Math.max(t.x, t.y, t.z) * 2.1;
  cam.position.set(c.x + Math.sin(a) * d, c.y + t.y * 0.08, c.z + Math.cos(a) * d); cam.lookAt(c);
  document.getElementById('info').textContent = `taille ${t.x.toFixed(2)} × ${t.y.toFixed(2)} × ${t.z.toFixed(2)} · ${Math.round(tri)} triangles`;
  window.__info = { taille: [t.x, t.y, t.z], triangles: Math.round(tri) };
  const boucle = () => { r.render(scene, cam); requestAnimationFrame(boucle); }; boucle();
  setTimeout(() => { window.__pret = true; }, 1500);
});
</script>
</body>
</html>
