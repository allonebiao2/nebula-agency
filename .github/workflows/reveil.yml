# NEBULA · garder les services Render éveillés, gratuitement.
#
# LE PROBLÈME. Un service Render gratuit s'endort après 15 minutes sans
# trafic, et son réveil prend environ une minute. Un partenaire qui ouvre son
# bureau tombe sur un écran « APPLICATION LOADING » et attend.
#
# LE PIÈGE À CONNAÎTRE. Les 750 heures gratuites de Render sont comptées
# PAR ESPACE DE TRAVAIL, pas par service, et un service endormi n'en consomme
# aucune. Donc maintenir un service éveillé 24h/24 coûte 24 × 30 = 720 h, soit
# presque tout le quota. En maintenir deux coûte 1 440 h : les DEUX se font
# suspendre jusqu'au mois suivant. Réveiller trop est pire que ne rien faire.
#
# LE CHOIX FAIT ICI. On ne réveille qu'aux heures ouvrées de Cotonou, 06h à
# 23h, soit 17 h par jour et environ 510 h par mois pour UN service. Il reste
# de la marge sous les 750. Personne n'ouvre le bureau des partenaires à 4h
# du matin, et Render se rendort tout seul la nuit sans rien consommer.
#
# ⚠️ SI TU AJOUTES UNE URL À LA LISTE, REFAIS LE CALCUL. Deux services
# éveillés 17 h par jour = 1 020 h. C'est déjà trop. Au-delà d'un service,
# il faut soit réduire la plage horaire, soit sortir le service de Render.
#
# ⚠️ CE N'EST PAS UNE GARANTIE. GitHub peut retarder un déclenchement
# programmé de plusieurs minutes aux heures de pointe. Le réveil devient rare,
# il ne devient pas impossible. Ce qui ne doit JAMAIS attendre (une page
# cadeau qu'on ouvre à minuit) n'a rien à faire sur Render : ça se sert depuis
# Cloudflare, voir vitrina/publier.py.
#
# À POSER UNE FOIS, dans Réglages du dépôt · Secrets and variables · Actions,
# onglet Variables (ce ne sont pas des secrets, ce sont des adresses publiques) :
#   URLS_A_REVEILLER   une URL par ligne, ou séparées par des espaces.
# Si la variable est absente, le workflow ne fait rien et ne casse rien.

name: NEBULA · réveil des services Render

on:
  schedule:
    # Toutes les 10 minutes entre 05:00 et 21:59 UTC, soit 06:00 à 22:59 à
    # Cotonou (le Bénin est à UTC+1 toute l'année, sans heure d'été).
    - cron: '*/10 5-21 * * *'
  workflow_dispatch:

# Deux réveils qui se chevauchent ne servent à rien.
concurrency:
  group: reveil-render
  cancel-in-progress: false

jobs:
  reveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pinguer chaque service
        env:
          URLS: ${{ vars.URLS_A_REVEILLER }}
        run: |
          set -uo pipefail
          if [ -z "${URLS// /}" ]; then
            echo "URLS_A_REVEILLER n'est pas posée. Rien à réveiller."
            exit 0
          fi

          echec=0
          for url in $URLS; do
            [ -z "$url" ] && continue
            echo "----- $url"
            # --max-time 90 : un réveil Render prend environ une minute, il
            # faut lui laisser le temps, sinon on raccroche avant qu'il soit
            # debout et on l'aura réveillé pour rien.
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
                        --max-time 90 --retry 2 --retry-delay 5 \
                        -A 'NEBULA-reveil/1.0' \
                        "$url" || echo "000")
            duree=$(curl -sS -o /dev/null -w '%{time_total}' \
                         --max-time 90 -A 'NEBULA-reveil/1.0' "$url" || echo "?")
            echo "  code=$code  temps=${duree}s"
            # Un 4xx prouve que le service est DEBOUT et qu'il a répondu :
            # c'est un réveil réussi. Seuls 000 (injoignable) et 5xx comptent
            # comme des échecs.
            case "$code" in
              000|5*) echo "  ECHEC"; echec=1 ;;
              *)      echo "  debout" ;;
            esac
          done
          exit $echec
