a_passer:
  - une réservation de table ou la place des fêtes
  - un devis traiteur, ou une commande pour plus de dix personnes
  - une réclamation, un retard, une commande qui s'est mal passée
  - tout ce qui touche à l'adresse exacte du restaurant ou à un itinéraire

