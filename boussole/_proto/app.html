    .sheet input[type="date"], .sheet input[type="month"] { color-scheme: dark; }
    .prange { display: flex; gap: 8px; }
    .prange .fld--sheet { flex: 1; }
    /* ============================================================================
       VAGUE 4 « LOGICIEL » : onboarding, toasts, enveloppes, alertes, chat IA,
       réglages, verrou par rôle, recherche, animations de touché par item
       ========================================================================== */
    /* ---- Onboarding plein écran ---- */
    .onb { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(120% 90% at 50% 0%, #141019 0%, #0B0F19 55%, #080b12 100%); overflow-y: auto; }
    .onb__logo { width: 74px; height: 74px; color: #f6a63c; filter: drop-shadow(0 0 18px rgba(246, 166, 60, .5)); animation: onbFloat 4s ease-in-out infinite; }
    @keyframes onbFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
    .onb__step { width: 100%; max-width: 420px; text-align: center; animation: onbIn .5s var(--ease-back) both; }
    @keyframes onbIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
    .onb__kicker { display: inline-block; margin-top: 18px; padding: 5px 13px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #ffc46a; background: rgba(246, 166, 60, .12); border: 1px solid rgba(246, 166, 60, .3); }
    .onb__title { margin: 12px 0 6px; font-size: clamp(26px, 7vw, 36px); font-weight: 800; letter-spacing: -.02em; color: #fff; }
    .onb__sub { margin: 0 0 18px; font-size: 14.5px; line-height: 1.55; color: rgba(255, 255, 255, .62); }
    .onb__step .sheet__txt, .onb__step .sheet__amt { margin-bottom: 10px; }
    .onb__go { width: 100%; margin-top: 8px; min-height: 52px; border: 0; border-radius: 16px; cursor: pointer; font: inherit; font-size: 16px; font-weight: 800; color: #1a1406;
      background: radial-gradient(120% 140% at 30% 20%, #ffe0a8, #f6a63c 60%, #d97f0e); box-shadow: 0 14px 30px -10px rgba(246, 166, 60, .55), inset 0 1px 0 rgba(255, 255, 255, .5); transition: transform .12s ease, filter .2s ease; }
    .onb__go:active { transform: scale(.97); }
    .onb__skip { margin-top: 12px; border: 0; background: none; color: rgba(255, 255, 255, .45); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline dotted; }
    .onb__dots { display: flex; gap: 7px; justify-content: center; margin-top: 22px; }
    .onb__dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .18); transition: background .3s, transform .3s; }
    .onb__dots i.on { background: #f6a63c; transform: scale(1.35); box-shadow: 0 0 10px rgba(246, 166, 60, .7); }
    .onb__choice { display: grid; gap: 10px; margin-top: 4px; }
    .onb__card { padding: 16px; border-radius: 16px; text-align: left; cursor: pointer; font: inherit; border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .04); transition: border-color .2s, background .2s, transform .12s; }
    .onb__card:active { transform: scale(.98); }
    .onb__card b { display: block; font-size: 15.5px; color: #fff; margin-bottom: 3px; }
    .onb__card span { font-size: 13px; color: rgba(255, 255, 255, .55); line-height: 1.45; }
    .onb__card--zero { border-color: rgba(52, 211, 153, .4); } .onb__card--zero:active { background: rgba(52, 211, 153, .1); }
    .onb__card--demo { border-color: rgba(246, 166, 60, .35); } .onb__card--demo:active { background: rgba(246, 166, 60, .08); }
    .onb__seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .onb__seg .seg-btn { border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .04); border-radius: 13px; padding: 11px 6px; }
    /* ---- Toasts (confirmations visuelles + Annuler) ---- */
    .toasts { position: fixed; left: 12px; right: 12px; bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    @media (min-width: 1024px) { .toasts { bottom: 24px; } }
    .toast { display: flex; align-items: center; gap: 12px; max-width: 440px; padding: 11px 14px; border-radius: 14px; pointer-events: auto;
      background: linear-gradient(180deg, rgba(30, 32, 42, .98), rgba(18, 19, 26, .98)); border: 1px solid rgba(255, 255, 255, .13);
      box-shadow: 0 16px 36px -14px rgba(0, 0, 0, .85), inset 0 1px 0 rgba(255, 255, 255, .07);
      font-size: 13.5px; font-weight: 600; color: rgba(255, 255, 255, .88); animation: toastIn .35s var(--ease-back) both; }
    .toast.is-going { animation: toastOut .3s ease both; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.95); } to { opacity: 1; transform: none; } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(10px) scale(.96); } }
    .toast--good { border-color: rgba(52, 211, 153, .4); } .toast--warn { border-color: rgba(255, 92, 92, .4); }
    .toast__act { border: 0; border-radius: 9px; padding: 7px 12px; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 800; color: #1a1406;
      background: radial-gradient(120% 120% at 30% 25%, #ffe38a, #f6a63c); box-shadow: 0 0 12px -4px rgba(246, 166, 60, .7); }
    /* ---- Les 3 enveloppes (Bilan) ---- */
    .envs { max-width: 500px; margin: 16px auto 0; display: grid; gap: 10px; }
    .env { position: relative; overflow: hidden; padding: 13px 15px 15px; border-radius: 16px; text-align: left; background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .1); animation: expIn .45s calc(var(--i) * 90ms) var(--ease) both; }
    .env__head { display: flex; align-items: center; gap: 9px; }
    .env__ic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; color: #04121a; background: radial-gradient(120% 120% at 30% 25%, color-mix(in srgb, var(--ec) 60%, #fff), var(--ec)); box-shadow: 0 0 14px -4px var(--ec); }
    .env__ic svg { width: 17px; height: 17px; }
    .env__name { flex: 1; font-size: 13.5px; font-weight: 800; color: #fff; }
    .env__amt { font-size: 15px; font-weight: 800; color: var(--ec); font-variant-numeric: tabular-nums; text-shadow: 0 0 14px color-mix(in srgb, var(--ec) 50%, transparent); }
    .env__bar { height: 7px; margin-top: 10px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
    .env__fill { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--ec) 55%, #fff0), var(--ec)); box-shadow: 0 0 12px -2px var(--ec); transition: width 1s var(--ease); }
    .env__sub { display: block; margin-top: 7px; font-size: 11.5px; color: rgba(255, 255, 255, .5); }
    /* ---- Alertes (écran Boussole + pastille barre) ---- */
    .tab { position: relative; }
    .tab__dot { position: absolute; top: 6px; right: calc(50% - 21px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; display: grid; place-items: center;
      font-size: 10.5px; font-weight: 800; color: #fff; background: radial-gradient(120% 120% at 30% 25%, #ff8a97, #e11d48); box-shadow: 0 0 12px -2px rgba(225, 29, 72, .8); animation: dotPop .4s var(--ease-back) both; }
    @keyframes dotPop { from { transform: scale(0); } to { transform: scale(1); } }
    .alerts { max-width: 500px; margin: 14px auto 0; display: flex; flex-direction: column; gap: 9px; }
    .alertrow { position: relative; overflow: hidden; display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px 13px; border-radius: 14px; cursor: pointer; text-align: left; font: inherit;
      background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .1); animation: expIn .4s calc(var(--i) * 70ms) var(--ease) both; }
    .alertrow__ic { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: #04121a; background: radial-gradient(120% 120% at 30% 25%, color-mix(in srgb, var(--ac) 55%, #fff), var(--ac)); box-shadow: 0 0 14px -4px var(--ac); }
    .alertrow__ic svg { width: 18px; height: 18px; }
    .alertrow__tx { flex: 1; font-size: 13.5px; line-height: 1.45; color: rgba(255, 255, 255, .85); }
    .alertrow__tx b { color: #fff; }
    .alertrow__go { color: rgba(255, 255, 255, .4); font-size: 17px; }
    .alertrow--warn { border-color: rgba(225, 29, 72, .3); }
    .alertrow--good { border-color: rgba(52, 211, 153, .3); }
    /* ---- Chat IA Boussole ---- */
    .chat { max-width: 500px; margin: 16px auto 0; display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .bub { max-width: 88%; padding: 11px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.5; animation: bubIn .35s var(--ease-back) both; }
    @keyframes bubIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
    .bub--q { align-self: flex-end; color: #1a1406; border-bottom-right-radius: 5px; background: radial-gradient(130% 140% at 30% 20%, #ffe0a8, #f6a63c); box-shadow: 0 8px 20px -10px rgba(246, 166, 60, .6); font-weight: 700; }
    .bub--a { align-self: flex-start; color: rgba(255, 255, 255, .88); border-bottom-left-radius: 5px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); }
    .bub--a b { color: #ffc46a; }
    .chatask { position: relative; max-width: 500px; margin: 12px auto 0; display: flex; gap: 8px; }
    .chatask .sheet__txt { flex: 1; margin: 0; }
    .chatask__go { flex: none; width: 48px; border: 0; border-radius: 14px; cursor: pointer; color: #1a1406; background: radial-gradient(120% 140% at 30% 20%, #ffe0a8, #f6a63c); box-shadow: 0 8px 20px -8px rgba(246, 166, 60, .6); display: grid; place-items: center; transition: transform .12s; }
    .chatask__go:active { transform: scale(.92) rotate(-8deg); }
    .chatask__go svg { width: 20px; height: 20px; }
    .quickqs { max-width: 500px; margin: 10px auto 0; display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
    /* ---- Réglages ---- */
    .setgrp { max-width: 500px; margin: 16px auto 0; padding: 15px 16px; border-radius: 18px; text-align: left; background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .1); animation: expIn .4s calc(var(--i, 0) * 80ms) var(--ease) both; }
    .setgrp__ttl { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gc, #ffc46a); }
    .setgrp__ttl svg { width: 16px; height: 16px; }
    .setrow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .setnote { margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: rgba(255, 255, 255, .45); }
    .setbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .setbtn { flex: 1; min-width: 130px; padding: 12px; border-radius: 13px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, .85); background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .14); transition: background .18s, transform .12s; }
    .setbtn:active { transform: scale(.97); background: rgba(255, 255, 255, .1); }
    .setbtn--warn { color: #ff8a97; border-color: rgba(225, 29, 72, .35); }
    .setbtn--warn.is-armed { color: #fff; background: linear-gradient(180deg, #ff5a76, #e11d48); animation: armPulse 1s ease-in-out infinite; }
    .cloudchip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .14); color: rgba(255, 255, 255, .75); }
    .cloudchip i { width: 8px; height: 8px; border-radius: 50%; background: #8a93a6; }
    .cloudchip.is-on i { background: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, .8); animation: syncBlink 2.4s ease-in-out infinite; }
    @keyframes syncBlink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    .demochip { display: inline-flex; align-items: center; gap: 7px; margin: 12px auto 0; padding: 6px 13px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .06em; color: #ffd23f; background: rgba(255, 210, 63, .1); border: 1px dashed rgba(255, 210, 63, .45); }
    /* ---- Verrou par rôle ---- */
    .lock { max-width: 420px; margin: 8vh auto 0; text-align: center; animation: onbIn .45s var(--ease-back) both; }
    .lock__shield { width: 76px; height: 76px; margin: 0 auto 14px; color: #ffc46a; filter: drop-shadow(0 0 20px rgba(246, 166, 60, .45)); animation: lockBreath 3s ease-in-out infinite; }
    @keyframes lockBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .lock__pin { display: flex; gap: 8px; max-width: 260px; margin: 16px auto 0; }
    .lock__pin .sheet__amt { letter-spacing: .35em; }
    .lock.is-no .lock__shield { animation: lockNo .4s ease; color: #ff5a6a; }
    @keyframes lockNo { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
    /* ---- Recherche + pagination ---- */
    .searchbar { position: relative; max-width: 480px; margin: 12px auto 0; }
    .searchbar svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: rgba(255, 255, 255, .35); pointer-events: none; }
    .searchbar .sheet__txt { margin: 0; padding-left: 38px; font-size: 14px; }
    .morebtn { display: block; width: 100%; max-width: 480px; margin: 12px auto 0; padding: 12px; border-radius: 13px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .04); border: 1px dashed rgba(255, 255, 255, .2); }
    .morebtn:active { background: rgba(255, 255, 255, .09); }
    .row-hid { display: none !important; }
    /* ---- Sélecteur « Qui tient la caisse ? » + vendeur sur les ventes ---- */
    .hdr__avatar { display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #1a1406; background: radial-gradient(120% 120% at 30% 25%, #ffe0a8, #f6a63c); box-shadow: 0 0 0 2px rgba(246, 166, 60, .35), 0 0 16px -4px rgba(246, 166, 60, .6); }
    .swrow { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; margin-bottom: 8px; border-radius: 14px; cursor: pointer; text-align: left; font: inherit; background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .12); transition: border-color .2s, background .2s; }
    .swrow.is-cur { border-color: rgba(246, 166, 60, .5); background: rgba(246, 166, 60, .08); }
    .swrow__av { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-weight: 800; color: #04121a; }
    .swrow__nm { flex: 1; font-size: 14px; font-weight: 700; color: #fff; }
    .swrow__nm small { display: block; font-size: 11.5px; font-weight: 600; color: rgba(255, 255, 255, .5); }
    .salerow__par { font-size: 11px; color: rgba(255, 255, 255, .45); }
    /* ---- ANIMATIONS DE TOUCHÉ : une signature par famille d'items ---- */
    .fx-receipt { animation: fxReceipt .5s var(--ease) both; }              /* vente = ticket qui frémit */
    @keyframes fxReceipt { 0% { transform: skewX(0); } 25% { transform: skewX(-2.4deg) scaleY(.97); } 55% { transform: skewX(1.6deg) scaleY(1.015); } 100% { transform: none; } }
    .fx-cashout { animation: fxCashout .45s ease both; }                    /* dépense = billet qui s'échappe */
    @keyframes fxCashout { 0% { transform: translateX(0); } 30% { transform: translateX(-9px) rotate(-.5deg); box-shadow: inset 3px 0 0 rgba(225, 29, 72, .6); } 100% { transform: none; } }
    .fx-shelf { animation: fxShelf .5s var(--ease-back) both; }             /* produit = rebond d'étagère */
    @keyframes fxShelf { 0% { transform: translateY(0); } 35% { transform: translateY(-7px) rotate(.8deg); } 70% { transform: translateY(2px) rotate(-.4deg); } 100% { transform: none; } }
    .fx-squash { animation: fxSquash .4s var(--ease-back) both; }           /* tuile caisse = pression caoutchouc */
    @keyframes fxSquash { 0% { transform: scale(1); } 40% { transform: scale(.9, .82); } 75% { transform: scale(1.05, 1.08); } 100% { transform: scale(1); } }
    .fx-wave { animation: fxWave .55s var(--ease) both; transform-style: preserve-3d; }   /* client = carte qui salue */
    @keyframes fxWave { 0% { transform: perspective(500px) rotateY(0); } 35% { transform: perspective(500px) rotateY(9deg); } 70% { transform: perspective(500px) rotateY(-5deg); } 100% { transform: perspective(500px) rotateY(0); } }
    .fx-coin { animation: fxCoin .55s var(--ease-back) both; }              /* projet = pièce dans la tirelire */
    @keyframes fxCoin { 0% { transform: translateY(0); filter: none; } 30% { transform: translateY(-8px) scale(1.02); filter: drop-shadow(0 8px 14px rgba(255, 210, 63, .35)); } 65% { transform: translateY(2px) scale(.99); } 100% { transform: none; filter: none; } }
    .fx-fold { animation: fxFold .5s var(--ease) both; transform-origin: 50% 0; }         /* document = papier qui se plie */
    @keyframes fxFold { 0% { transform: perspective(600px) rotateX(0); } 35% { transform: perspective(600px) rotateX(-11deg); } 70% { transform: perspective(600px) rotateX(4deg); } 100% { transform: none; } }
    .fx-tiltz { animation: fxTiltz .45s var(--ease) both; }                 /* membre = badge scanné */
    @keyframes fxTiltz { 0% { transform: rotate(0); } 30% { transform: rotate(-1.6deg) scale(.985); } 65% { transform: rotate(1deg) scale(1.008); } 100% { transform: none; } }
    .fx-glowp { animation: fxGlowp .55s ease both; }                        /* KPI = pouls lumineux */
    @keyframes fxGlowp { 0% { box-shadow: 0 0 0 0 rgba(246, 166, 60, 0); } 35% { box-shadow: 0 0 26px -4px rgba(246, 166, 60, .55), 0 0 0 1px rgba(246, 166, 60, .35); transform: scale(1.025); } 100% { box-shadow: 0 0 0 0 rgba(246, 166, 60, 0); transform: scale(1); } }
    .fx-elastic { animation: fxElastic .38s var(--ease-back) both; }        /* chips / segments = élastique */
    @keyframes fxElastic { 0% { transform: scale(1); } 40% { transform: scale(1.14, .9); } 70% { transform: scale(.95, 1.06); } 100% { transform: scale(1); } }
    .fx-radar { animation: fxRadar .5s ease both; }                         /* alerte = écho radar */
    @keyframes fxRadar { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ac, #f6a63c) 55%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
    .fx-wobble { animation: fxWobble .6s var(--ease) both; }                /* enveloppe = liquide secoué */
    @keyframes fxWobble { 0% { transform: rotate(0); } 20% { transform: rotate(1.4deg); } 45% { transform: rotate(-1.1deg); } 70% { transform: rotate(.6deg); } 100% { transform: rotate(0); } }
    .fx-press { animation: fxPress .35s ease both; }                        /* chiffre vital = enfoncement 3D */
    @keyframes fxPress { 0% { transform: perspective(400px) translateZ(0); } 40% { transform: perspective(400px) translateZ(-16px); } 100% { transform: perspective(400px) translateZ(0); } }
    .fx-launch { animation: fxLaunch .4s var(--ease-back) both; }           /* bouton valider = décollage */
    @keyframes fxLaunch { 0% { transform: translateY(0); } 35% { transform: translateY(3px) scale(.97); } 75% { transform: translateY(-2px) scale(1.015); } 100% { transform: none; } }
    .fx-plane { animation: fxPlane .5s var(--ease) both; }                  /* message relance = avion en papier */
    @keyframes fxPlane { 0% { transform: rotate(0) translateX(0); } 40% { transform: rotate(-2deg) translateX(6px); } 100% { transform: none; } }
    /* ---- Visuel premium : liseré doré vivant sur les panneaux ---- */
    .panel::after, .ia::after, .env::after, .setgrp::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
      background: linear-gradient(140deg, rgba(246, 166, 60, .5), rgba(255, 255, 255, .05) 32%, rgba(52, 211, 153, .3) 68%, rgba(246, 166, 60, .22));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; opacity: .55; }
    .panel, .ia, .env, .setgrp { position: relative; }
    .screen__title { background: linear-gradient(100deg, #fff 30%, #ffe0a8 46%, #fff 62%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: titleShine 1.6s ease .3s 1 both; }
    @keyframes titleShine { from { background-position: 120% 0; } to { background-position: -60% 0; } }
    ::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { border-radius: 99px; background: linear-gradient(180deg, rgba(246, 166, 60, .35), rgba(246, 166, 60, .12)); border: 2px solid #0B0F19; }
    .kpi__spark { position: absolute; right: 10px; bottom: 8px; width: 74px; height: 26px; opacity: .8; pointer-events: none; }
    .kpi__spark path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px currentColor); }
    /* ---- LA CAISSE = UN COFFRE : les portes s'ouvrent sur tes produits ---- */
    .vaultwrap { position: relative; }
    .vault { position: absolute; inset: -6px; z-index: 5; display: flex; border-radius: 20px; overflow: hidden; pointer-events: none; perspective: 900px; }
    .vault__door { position: relative; flex: 1; background:
        radial-gradient(140% 120% at 50% 45%, #232635 0%, #171a26 55%, #10121b 100%);
      border: 1px solid rgba(246, 166, 60, .25); box-shadow: inset 0 0 40px -18px rgba(246, 166, 60, .35), inset 0 1px 0 rgba(255, 255, 255, .1);
      transition: transform .65s cubic-bezier(.6, .05, .25, 1); }
    .vault__door--l { border-radius: 20px 0 0 20px; transform-origin: left center; }
    .vault__door--r { border-radius: 0 20px 20px 0; transform-origin: right center; }
    .vault__door::before { content: ""; position: absolute; inset: 10px; border-radius: 12px; border: 1px dashed rgba(246, 166, 60, .28); }   /* liseré rivets */
    .vault__wheel { position: absolute; top: 50%; width: 62px; height: 62px; color: #ffc46a; filter: drop-shadow(0 0 14px rgba(246, 166, 60, .55)); }
    .vault__door--l .vault__wheel { right: -31px; transform: translateY(-50%); }
    .vault__door--r .vault__wheel { left: -31px; transform: translateY(-50%); }
    .vault.is-turning .vault__wheel { animation: vaultTurn .55s cubic-bezier(.5, .1, .4, 1) both; }
    @keyframes vaultTurn { from { rotate: 0deg; } to { rotate: 260deg; } }
    .vault.is-open .vault__door--l { transform: rotateY(-96deg); }
    .vault.is-open .vault__door--r { transform: rotateY(96deg); }
    .vault.is-open { transition: opacity .2s .6s; opacity: 0; }
    .vault.is-gone { display: none; }
    .vault ~ .pos .pos-tile, .vaultwrap.is-sealed .pos-tile { animation-play-state: paused; }   /* les tuiles attendent l'ouverture */
    .vaultwrap.is-revealed .pos-tile { animation-play-state: running; }
    /* ---- Coût détaillé d'un produit : qui prend quoi, % auto ---- */
    .csplit { margin: 2px 0 10px; padding: 11px 12px; border-radius: 14px; background: rgba(255, 255, 255, .035); border: 1px dashed rgba(255, 255, 255, .18); text-align: left; }
    .csplit__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .csplit__head span { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .55); }
    .csplit__addbtn { border: 1px solid rgba(246, 166, 60, .4); background: rgba(246, 166, 60, .1); color: #ffc46a; font: inherit; font-size: 12px; font-weight: 800; padding: 6px 11px; border-radius: 999px; cursor: pointer; }
    .csplit__addbtn:active { transform: scale(.95); }
    .cline { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; animation: expIn .3s var(--ease) both; }
    .cline .sheet__txt { margin: 0; padding: 10px 11px; font-size: 13.5px; }
    .cline__nom { flex: 1.5; } .cline__amt { flex: 1; text-align: right; font-variant-numeric: tabular-nums; }
    .cline__pct { flex: none; min-width: 44px; text-align: right; font-size: 11.5px; font-weight: 800; color: #ffc46a; font-variant-numeric: tabular-nums; }
    .cline__x { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 1px solid rgba(255, 90, 106, .35); background: rgba(255, 90, 106, .08); color: #ff8a97; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
    .csplit__foot { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, .6); border-top: 1px solid rgba(255, 255, 255, .1); padding-top: 8px; margin-top: 2px; }
    .csplit__foot b { color: #fff; font-variant-numeric: tabular-nums; }
    .vresa { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(246, 166, 60, .07); border: 1px dashed rgba(246, 166, 60, .35); text-align: left; }
    .vresa__ttl { display: block; font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #ffc46a; margin-bottom: 6px; }
    .vresa__row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: rgba(255, 255, 255, .8); padding: 2px 0; }
    .vresa__row b { font-variant-numeric: tabular-nums; color: #ffd9a0; }
    /* ============================================================================
       VAGUE 1 TRANSITIONS : chaque écran est un LIEU, on y entre par un geste
       ========================================================================== */
    /* ---- VENTES : le ticket s'imprime (rouleau + papier qui sort + total tamponné) ---- */
    .printwrap { position: relative; }
    .print__roll { position: absolute; top: -7px; left: 6%; right: 6%; height: 15px; z-index: 3; border-radius: 999px; opacity: 0; pointer-events: none;
      background: linear-gradient(180deg, #3a4152, #14161f 60%, #0c0e15); border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .2); }
    .print__roll::after { content: ""; position: absolute; left: 10px; right: 10px; top: 50%; border-top: 2px dotted rgba(255, 255, 255, .22); }   /* perforations */
    .printwrap.is-live { overflow: hidden; border-radius: 16px; }
    .printwrap.is-live .print__roll { opacity: 1; animation: rollFade .4s 1s ease both; }
    .printwrap.is-live .saleslist { animation: paperOut .75s cubic-bezier(.25, .8, .3, 1) both; }
    @keyframes paperOut { from { transform: translateY(-101%); } to { transform: translateY(0); } }
    @keyframes rollFade { to { opacity: 0; } }
    .sales-total .stamp { display: inline-block; }
    .is-stamp .stamp { animation: stampIn .5s .55s var(--ease-back) both; }
    @keyframes stampIn { 0% { opacity: 0; transform: scale(1.9) rotate(-7deg); } 60% { opacity: 1; transform: scale(.94) rotate(1.5deg); } 100% { transform: scale(1) rotate(0); } }
    /* ---- DÉPENSES : le portefeuille s'ouvre (2 volets cuir + billets qui s'envolent) ---- */
    .walletwrap { position: relative; }
    .wallet { position: absolute; inset: -6px; z-index: 5; display: none; flex-direction: column; border-radius: 18px; overflow: hidden; pointer-events: none; perspective: 800px; }
    .walletwrap.is-live .wallet { display: flex; }
    .wallet__flap { position: relative; flex: 1;
      background: radial-gradient(130% 130% at 50% 40%, #3a2a20 0%, #241812 55%, #17100c 100%);
      border: 1px solid rgba(225, 29, 72, .3); box-shadow: inset 0 0 34px -14px rgba(225, 29, 72, .35), inset 0 1px 0 rgba(255, 255, 255, .08); }
    .wallet__flap::before { content: ""; position: absolute; inset: 9px; border-radius: 12px; border: 2px dashed rgba(255, 210, 160, .25); }   /* couture cuir */
    .wallet__flap--t { border-radius: 18px 18px 0 0; transform-origin: top center; animation: flapT .6s .3s cubic-bezier(.6, .05, .3, 1) both; }
    .wallet__flap--b { border-radius: 0 0 18px 18px; transform-origin: bottom center; animation: flapB .6s .3s cubic-bezier(.6, .05, .3, 1) both; }
    @keyframes flapT { to { transform: rotateX(94deg); } }
    @keyframes flapB { to { transform: rotateX(-94deg); } }
    .wallet__snap { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; z-index: 2; border-radius: 50%;
      background: radial-gradient(120% 120% at 30% 25%, #ffe0a8, #b8742a); box-shadow: 0 0 14px -3px rgba(246, 166, 60, .8), inset 0 -3px 5px rgba(0, 0, 0, .4); animation: snapPop .3s .18s ease both; }
    @keyframes snapPop { 40% { transform: scale(1.25); } to { transform: scale(0); opacity: 0; } }
    .wallet__bill { position: absolute; left: 30%; top: 42%; width: 44px; height: 22px; border-radius: 4px; opacity: 0;
      background: linear-gradient(140deg, #4ade8e, #1f9d61); border: 1px solid rgba(255, 255, 255, .35); animation: billFly .8s .45s ease-out both; }
    .wallet__bill + .wallet__bill { left: 56%; top: 46%; background: linear-gradient(140deg, #ffd97a, #d99a2b); animation-delay: .55s; }
    @keyframes billFly { 0% { opacity: 0; transform: translateY(0) rotate(0); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-90px) translateX(24px) rotate(38deg); } }
    .wallet.is-done { display: none !important; }
    /* ---- OBJECTIFS : la flèche se plante dans la cible ---- */
    .objgoal { position: relative; }
    .arrowfly { display: none; position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; margin: -64px 0 0 -64px; z-index: 3; pointer-events: none;
      color: #ffd23f; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .5)) drop-shadow(0 0 10px rgba(255, 210, 63, .45)); }
    .objgoal.is-live .arrowfly { display: block; animation: arrowFly .5s .25s cubic-bezier(.45, 0, .85, .5) both, arrowGone .35s 2.2s ease both; }
    @keyframes arrowFly { 0% { opacity: 0; transform: translate(-300px, -300px); } 12% { opacity: 1; } 100% { opacity: 1; transform: translate(0, 0); } }
    @keyframes arrowGone { to { opacity: 0; } }
    .objgoal.is-hit { animation: ringHit .4s ease both; }
    @keyframes ringHit { 0% { transform: translate(0); } 25% { transform: translate(-4px, 3px) rotate(-.5deg); } 55% { transform: translate(3px, -2px) rotate(.4deg); } 100% { transform: none; } }
    /* ---- BOUSSOLE : l'aiguille se calibre puis se fixe sur toi ---- */
    .calib { display: none; place-items: center; margin: 14px auto 2px; width: 92px; height: 92px; position: relative; }
    .screen.is-calib .calib { display: grid; }
    .calib svg { width: 92px; height: 92px; color: #ffc46a; filter: drop-shadow(0 0 14px rgba(246, 166, 60, .4)); }
    .calib__needle { transform-origin: 50px 50px; animation: needleSpin 1.15s cubic-bezier(.3, .6, .3, 1) both; }
    @keyframes needleSpin { 0% { rotate: 0deg; } 55% { rotate: 760deg; } 70% { rotate: 700deg; } 82% { rotate: 732deg; } 92% { rotate: 714deg; } 100% { rotate: 720deg; } }
    .calib::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid rgba(246, 166, 60, .55); opacity: 0; }
    .calib.is-locked::after { animation: calibHalo .55s ease both; }
    @keyframes calibHalo { 0% { opacity: .9; transform: scale(.75); } 100% { opacity: 0; transform: scale(1.5); } }
    .calib.is-gone { animation: calibShrink .4s ease both; }
    @keyframes calibShrink { to { transform: scale(.4); opacity: 0; height: 0; margin: 0; } }
    /* ---- Confettis d'objectif (1 fois par jour) + flamme de série ---- */
    .confetti { position: fixed; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
    .confetti span { position: absolute; top: -7vh; border-radius: 2.5px; animation: confFall linear both; box-shadow: 0 0 6px -2px currentColor; }
    @keyframes confFall { to { transform: translateY(116vh) rotate(680deg); } }
    .streak { display: inline-flex; align-items: center; gap: 8px; margin: 12px auto 0; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 800; color: #ffd9a0;
      background: linear-gradient(140deg, rgba(255, 106, 61, .16), rgba(246, 166, 60, .08)); border: 1px solid rgba(255, 138, 61, .45); box-shadow: 0 0 18px -8px rgba(255, 138, 61, .7); animation: expIn .5s .5s var(--ease) both; }
    .streak i { font-style: normal; font-size: 16px; animation: flameFlick 1.1s ease-in-out infinite alternate; }
    @keyframes flameFlick { from { transform: scale(1) rotate(-4deg); } to { transform: scale(1.18) rotate(5deg); } }
    .streak b { color: #fff; }
    @media (prefers-reduced-motion: reduce) {
      .fx-receipt, .fx-cashout, .fx-shelf, .fx-squash, .fx-wave, .fx-coin, .fx-fold, .fx-tiltz, .fx-glowp, .fx-elastic, .fx-radar, .fx-wobble, .fx-press, .fx-launch, .fx-plane,
      .onb__logo, .onb__step, .toast, .bub, .lock, .lock__shield, .screen__title, .env, .alertrow, .setgrp, .pos-tile, .vault__wheel, .streak i, .confetti span { animation: none !important; }
      .env__fill { transition: none; }
      .vault, .wallet, .arrowfly, .confetti { display: none !important; }
      .vaultwrap.is-sealed .pos-tile { animation-play-state: running; }
      .printwrap.is-live .saleslist, .printwrap.is-live .print__roll, .is-stamp .stamp, .calib__needle, .objgoal.is-hit { animation: none !important; }
    }
  </style>
</head>
<body>
  <!-- Calque de profondeur : halos aurore + poussières lumineuses (derrière tout le contenu) -->

    <!-- CONTENU : écran courant (rempli par showSection) -->

    <!-- OVERLAY + DRAWER -->
    <div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
      <div class="drawer__head">
        <span class="drawer__brand">
          <span aria-hidden="true"><svg viewBox="0 0 100 100" fill="none">
            <circle class="ring" cx="50" cy="50" r="43" stroke-width="2.6"/>
            <circle class="ring ring--in" cx="50" cy="50" r="35" stroke-width="1.2"/>
            <g class="ticks" stroke-width="2.6" stroke-linecap="round"><line x1="50" y1="4" x2="50" y2="13"/><line x1="96" y1="50" x2="87" y2="50"/><line x1="50" y1="96" x2="50" y2="87"/><line x1="4" y1="50" x2="13" y2="50"/></g>
            <path class="rose-ew" d="M20 50 L50 46 L80 50 L50 54 Z"/><path class="rose-s" d="M50 84 L43 50 L57 50 Z"/><path class="rose-n" d="M50 16 L43 50 L57 50 Z"/><circle class="hub" cx="50" cy="50" r="3.6"/>
          </svg></span>
          Boussole

    import { SUPABASE_URL, SUPABASE_ANON_KEY, ADMIN_EMAILS } from '../assets/js/config.js';

    /* ===== Écrans (scaffold) + caméra : arrivée CINÉMATIQUE (1er rendu) / navigation HUD SÈCHE (clic) ===== */

    /* ===== Smart Greeting Engine v2 : Boussole te parle de TON argent ===================
       3 voix : (1) le MIROIR — résumés et avis honnêtes calculés sur tes vrais chiffres,
       (2) l'ÉCOLE — leçons d'argent courtes, (3) l'ÉTINCELLE — questions qui font réfléchir.
       Anti-répétition : historique persisté (SM.greetHist) — jamais deux fois la même
       phrase tant que tout le stock n'a pas été entendu. ======================================= */
    const LECONS = [
      "le chiffre d'affaires nourrit l'ego, le bénéfice nourrit ta famille.",
      "un franc économisé se gagne plus vite qu'un franc vendu.",
      "trois enveloppes, toujours : relancer, payer, garder. Dans cet ordre.",
      "un crédit sans date de retour, c'est un cadeau déguisé.",
      "ton stock, c'est de l'argent qui dort sur l'étagère. Réveille-le.",
      "note chaque sortie le jour même : la mémoire est le pire des comptables.",
      "le client qui paie vite vaut deux fois celui qui achète gros.",
      "augmenter tes prix fait fuir moins de clients que tu ne le crois.",
      "ce que tu ne mesures pas, tu ne peux pas l'améliorer.",
      "la régularité bat le talent : 5 000 F chaque jour valent mieux qu'un coup d'éclat.",
      "paie-toi un salaire fixe. Le reste appartient au commerce.",
      "un produit invendu depuis 30 jours te coûte de l'argent chaque nuit.",
      "le bon moment pour épargner, c'était hier. Le deuxième, c'est aujourd'hui.",
      "connais ton coût de revient par cœur : c'est lui qui fixe ton prix, pas le voisin.",
      "une dette relancée poliment est à moitié récupérée.",
      "les charges fixes sont des petites dents : elles mordent chaque mois.",
      "vendre à perte pour « faire tourner », c'est courir vers le mur en souriant.",
      "l'argent aime les comptes clairs. Le désordre le fait fuir.",
      "celui qui connaît ses chiffres négocie. Celui qui devine, subit.",
      "mieux vaut dix clients fidèles que cent curieux.",
      "chaque grosse vente cache un coût : réserve-le avant de célébrer.",
      "ta caisse du soir raconte ta journée. Écoute-la ici même.",
      "compte d'abord, dépense ensuite. Jamais l'inverse.",
      "ton meilleur produit mérite la meilleure place de la boutique.",
      "la poche du commerce et ta poche sont deux pays différents. Garde la frontière.",
      "on ne devient pas riche en un jour, mais on le devient chaque jour.",
    ];
    const ETINCELLES = [
      "sais-tu quel jour de la semaine tu vends le plus ? La réponse t'attend dans Statistiques.",
      "si tu devais doubler UN seul prix demain, lequel choisirais-tu ?",
      "combien te coûte une journée de boutique fermée ? Fais le calcul, ça réveille.",
      "quel bon client n'est pas revenu depuis longtemps ? Un petit message change tout.",
      "ton objectif du jour pique-t-il assez ? Un objectif trop facile n'apprend rien.",
      "que ferais-tu avec 30 jours de bénéfice mis de côté ? Commence aujourd'hui.",

      "si je ne te montrais qu'un chiffre chaque matin, lequel voudrais-tu ? Viens me le dire.",
      "quelle vente d'aujourd'hui pourrait devenir une habitude de client ?",
    ];
    function greetPool() {   // le MIROIR : phrases construites sur TES chiffres du moment
      const P = [];
      const add = (id, txt, w) => P.push({ id, txt, w: w || 3 });
      try {
        const t0d = startOfToday(), st = salesToday(), obj = objJour();
        const caHier = caBetween(t0d - DAY, t0d), caAvHier = caBetween(t0d - 2 * DAY, t0d - DAY);
        const e = enveloppes(), streak = calcStreak();
        const dettes = (SM.clients || []).reduce((s, c) => s + (c.dette || 0), 0);
        const rupt = SM.stock.filter((p) => p.type === 'physique' && p.qty <= 0);
        const top = topProduit(t0d - 30 * DAY);
        if (!(SM.ventes || []).length) add('d-first', "ta première vente t'attend à la caisse. Après la première, tout s'enchaîne.");
        if (caHier > 0) add('d-hier', 'hier tu as encaissé ' + fF(caHier) + (caAvHier > 0 ? (caHier >= caAvHier ? ', mieux qu\'avant-hier. La pente est bonne.' : ', un peu moins qu\'avant-hier. On la retourne aujourd\'hui ?') : '. Aujourd\'hui, on fait mieux ?'));
        if (caHier === 0 && caAvHier > 0) add('d-hier0', 'hier, caisse à zéro. Ça arrive aux meilleurs — l\'important, c\'est aujourd\'hui.');
        if (st > 0 && obj > 0 && st < obj) add('d-obj', 'tu es à ' + Math.round(st / obj * 100) + '% de ton objectif. Reste ' + fF(obj - st) + ' : c\'est une ou deux bonnes ventes.');
        if (obj > 0 && st >= obj) add('d-objdone', 'objectif du jour déjà atteint. Franchement ? Chapeau. Le reste, c\'est du bonus.');
        if (streak >= 2) add('d-streak', streak + ' jours de suite à objectif atteint. Les habitudes font les fortunes — ne casse pas la série.');
        if (dettes > 0) add('d-dettes', 'on te doit ' + fF(dettes) + '. L\'argent dehors ne travaille pas pour toi : un tour au Carnet ?');
        if (rupt.length) add('d-rupt', rupt.length + ' produit' + (rupt.length > 1 ? 's' : '') + ' en rupture, dont ' + rupt[0].nom + '. Chaque heure sans stock, c\'est une vente offerte au voisin.');
        if (e.ca > 0 && e.manque > 0 && new Date().getDate() >= 8) add('d-manque', 'avis honnête : ta marge du mois ne couvre pas encore tes charges (il manque ' + fF(e.manque) + '). On serre, on vend, on y arrive.');
        if (e.env3 > 0) add('d-env3', 'bénéfice net du mois : ' + fF(e.env3) + '. C\'est ça ton vrai salaire — pas le chiffre de la caisse.');
        if (top) add('d-top', 'ton champion : ' + top.nom + ' (' + fF(top.tot) + ' en 30 jours). Mets-le devant, il te le rendra.');
        if (e.ca > 0 && e.cout > 0 && (e.ca - e.cout) / e.ca < 0.25) add('d-marge', 'avis franc : ta marge moyenne est fine (' + Math.round((e.ca - e.cout) / e.ca * 100) + '%). Acheter moins cher ou vendre plus cher — il faudra choisir.');
        if ((SM.ventes || []).length > 3 && !(SM.depenses || []).length) add('d-nodep', 'tu encaisses, mais aucune sortie notée… Sans les sorties, ton bénéfice est une illusion. Sois honnête avec toi-même.');
        const perso = persoTotal();
        if (perso > 0 && e.env3 > 0 && perso > e.env3) add('d-perso', 'ta poche perso (' + fF(perso) + ') dépasse ton bénéfice net du mois. Se payer : oui. Se vider : non.');
        const caSem = caBetween(t0d - 6 * DAY, Date.now() + 1);
        if (caSem > 0) add('d-sem', 'ta semaine : ' + fF(caSem) + ' encaissés, ~' + fF(Math.round(caSem / 7)) + ' par jour. Tu veux monter la moyenne ? Vise les heures creuses.', 2);
      } catch (er) {}
      LECONS.forEach((l, i) => P.push({ id: 'l' + i, txt: 'retiens ça : ' + l, w: 1 }));
      ETINCELLES.forEach((q, i) => P.push({ id: 'q' + i, txt: 'question pour toi : ' + q, w: 1.6 }));
      return P;
    }
    function pickGreeting() {   // jamais deux fois la même tant que le stock n'est pas épuisé
      SM.greetHist = SM.greetHist || [];
      let pool = greetPool().filter((g) => SM.greetHist.indexOf(g.id) < 0);
      if (!pool.length) { SM.greetHist = SM.greetHist.slice(-4); pool = greetPool().filter((g) => SM.greetHist.indexOf(g.id) < 0); }
      const tot = pool.reduce((s, g) => s + g.w, 0); let r = Math.random() * tot; let sel = pool[0];
      for (let i = 0; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) { sel = pool[i]; break; } }
      SM.greetHist.push(sel.id); if (SM.greetHist.length > 90) SM.greetHist.shift();
      try { smSave(); } catch (er) {}
      return sel.txt;
    }
    const greetingFull = () => { const h = new Date().getHours(); return (h < 12 ? 'Bonjour' : h < 18 ? 'Bel après-midi' : 'Bonsoir') + ' ' + userName + ' — ' + pickGreeting(); };
    let _typeTimer = null;
    function typeInto(el, full, speed) {
      clearTimeout(_typeTimer);
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = full; return; }   // a11y : pas de frappe
      let i = 0; el.textContent = '';
      const step = () => { i++; el.textContent = full.slice(0, i); playType(); if (i < full.length) _typeTimer = setTimeout(step, speed); };   // son synchro à la lettre
      _typeTimer = setTimeout(step, speed);   // machine à écrire, 50 ms/caractère
    }
    function renderGreeting() {
      const hi = view.querySelector('.hud__hi'); if (!hi) return;

      hi.innerHTML = '<span class="hud__ghost" aria-hidden="true">' + full + '</span>' +
                     '<span class="hud__type"><span class="hud__txt"></span><span class="hud__caret" aria-hidden="true"></span></span>';
      typeInto(hi.querySelector('.hud__txt'), full, Math.max(16, Math.min(45, Math.round(2400 / full.length))));   // vitesse adaptée : les longues phrases se tapent plus vite
    }
    const ICON_SELL  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 10.6a1.5 1.5 0 0 1-1.5 1.4H8.5A1.5 1.5 0 0 1 7 18.6z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>';

    // Accueil : HUD de bienvenue (salutation dynamique) + 2 mastodontes Vendre / Dépenser
    function accueilHTML(cls) {
      const ca = salesTotal(), stoday = salesToday(), objPct = Math.min(100, Math.round(stoday / objJour() * 100));   // vrais chiffres

    // Stock de DÉMO : chargé UNIQUEMENT en mode démo (plus jamais imposé au vrai commerçant)
    const DEMO_STOCK = [

    function removeSale(id) {
      const i = (SM.ventes || []).findIndex((v) => v.id === id); if (i < 0) return null;
      const sale = SM.ventes[i];
      (sale.items || []).forEach((it) => {   // restitue le stock des produits physiques (repérés par nom)

      });
      if (sale.mode === 'credit' && sale.clientId) {   // efface aussi la dette liée

      }
      SM.ventes.splice(i, 1); smSave();
      return { sale, i };
    }
    function restoreSale(buf) {   // « Annuler » : remet la vente, redéduit le stock, remet la dette
      if (!buf) return;

      if (buf.sale.mode === 'credit' && buf.sale.clientId) { const c = (SM.clients || []).find((x) => x.id === buf.sale.clientId); if (c) c.dette = (c.dette || 0) + buf.sale.total; }
      SM.ventes.splice(Math.min(buf.i, SM.ventes.length), 0, buf.sale); smSave();

    function iaBannerObj(per, cur, tgt, rate) {

    const bizNom = () => (SM.biz && SM.biz.nom) || 'Ton commerce';

    const STATUTS = ['brouillon', 'envoyé', 'payé'];

      const css = 'body{font-family:Arial,Helvetica,sans-serif;color:#14161c;max-width:640px;margin:24px auto;padding:0 20px}.h{display:flex;justify-content:space-between;border-bottom:2px solid #14161c;padding-bottom:14px}.h b{font-size:20px}.t{text-align:right}.t .big{font-size:22px;font-weight:800;letter-spacing:.04em}.meta{display:flex;justify-content:space-between;margin:16px 0;font-size:13px;color:#444}.meta b{color:#14161c}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th{text-align:left;border-bottom:1px solid #ccc;padding:7px 4px;font-size:11px;text-transform:uppercase;color:#666}td{padding:8px 4px;border-bottom:1px solid #eee}.r{text-align:right}.tot{margin:14px 0 0 auto;width:55%}.tot div{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}.tot .ttc{font-size:17px;font-weight:800;border-top:2px solid #14161c;margin-top:6px;padding-top:8px}.foot{margin-top:22px;font-size:12px;color:#666;text-align:center}';
      const html = '<!doctype html><html><head><meta charset="utf-8"><title>' + d.num + '</title><style>' + css + '</style></head><body>' +

    function bindFactures() {

    if (!SM.equipe) {

      SM.equipe = SM.meta.demo ? [
        { id: 'e1', nom: patronNom, role: 'patron', pin: '', actif: true, ventes: 0 },

    // ---- PIN : jamais en clair -> empreinte (hash salé). Migration des anciens codes clairs.
    function pinHash(p) { let h = 5381; const s = 'bsl:' + p; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); }
    (SM.equipe || []).forEach((m) => { if (m.pin) { m.pinH = pinHash(m.pin); delete m.pin; } });
    const activeMember = () => (SM.equipe || []).find((m) => m.id === SM.meta.activeId) || SM.equipe[0] || { id: 'e1', nom: 'Patron', role: 'patron' };
    const activeRole = () => activeMember().role || 'patron';

      }).join('');

        '<div class="ia"><span class="ia__orb"></span><span class="ia__chip">&#10022; Sécurité anti-vol</span><h3 class="ia__title">Chacun son code</h3><p class="ia__txt">Chaque vendeur a son propre code : tu vois <b>qui a vendu quoi</b>, et un vendeur ne voit ni ton <b>bénéfice</b> ni tes <b>réglages</b>. C\'est ta protection contre les pertes.</p></div>' +

    }

    /* ============================================================================

    async function cloudPull() {
      try {

        const res = await c.from('boussole_proto_etat').select('etat,updated_at').eq('user_id', session.user.id).maybeSingle();

    function countUpNums(scope) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      (scope || view).querySelectorAll('.kpi__num, .benhero__num').forEach((el, i) => {
        const txt = el.textContent, m = txt.replace(/[\s ]/g, '').match(/-?\d+/); if (!m) return;
        const target = Math.abs(+m[0]); if (!target) return;
        const prefix = txt.slice(0, txt.search(/\d/)).trim(); const suffix = txt.slice(txt.search(/\d[^\d\s]*$/)).replace(/^[\d\s ]+/, '');
        const DUR = 850, start = performance.now() + i * 90;
        const tick = (now) => {
          if (now < start) return requestAnimationFrame(tick);
          const p = Math.min(1, (now - start) / DUR), e = 1 - Math.pow(1 - p, 3);
          el.textContent = prefix + vitalFmt(Math.round(target * e)) + (suffix ? ' ' + suffix : '');
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }

    // Bascule "kinetic" : les mastodontes s'inclinent VERS le curseur/doigt (-5..5°), comme une plaque métallique
    function bindMastoTilt() {
      const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      view.querySelectorAll('.masto__btn').forEach((btn) => {
        let raf = 0, down = false;
        const apply = (e) => {
          const r = btn.getBoundingClientRect();
          const rx = (0.5 - (e.clientY - r.top) / r.height) * 10;   // -5..5°
          const ry = ((e.clientX - r.left) / r.width - 0.5) * 10;   // -5..5°
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => { btn.style.transform = 'rotateX(' + rx.toFixed(1) + 'deg) rotateY(' + ry.toFixed(1) + 'deg) translateY(-4px)' + (down ? ' scale(.97)' : ''); });
        };
        const reset = () => { if (raf) cancelAnimationFrame(raf); raf = 0; down = false; btn.style.transform = ''; };
        // ---- Audio-haptique (actif même en mouvement réduit) ----
        btn.addEventListener('pointerenter', () => {   // "sous tension" + première pluie de pièces/billets (throttle 900 ms)
          startCharge();
          const now = performance.now();
          if (!btn._lastFx || now - btn._lastFx > 900) { btn._lastFx = now; mastoBurst(btn, false); }
        });
        btn.addEventListener('pointerdown', (e) => {
          (btn.classList.contains('masto__btn--sell') ? playSell : playSpend)();           // System Snap à T0 (VENDRE=chime / DÉPENSER=impact)
          mastoBurst(btn, true);                                                           // grosse salve + étiquettes de vraies données
          try { if (navigator.vibrate) navigator.vibrate(15); } catch (_) {}
          if (!rm) { down = true; apply(e); }                                              // pression mobile : incline + enfonce
        });
        btn.addEventListener('pointerleave', () => { if (!rm) reset(); stopCharge(); });    // coupe le "bzz" instantanément
        btn.addEventListener('pointercancel', () => { if (!rm) reset(); stopCharge(); });
        // ---- Bascule 3D : uniquement si le mouvement est autorisé ----
        if (!rm) { btn.addEventListener('pointermove', apply); btn.addEventListener('pointerup', reset); }
      });
    }

    // ===== Chiffres clés : comptage de 0 jusqu'à la valeur (léger, sans à-coups) =====
    function vitalFmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }   // séparateur de milliers
    function bindVitals() {
      const scene = view.querySelector('.vitals'); if (!scene) return;
      const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      scene.querySelectorAll('.vital').forEach((card, i) => {
        card.addEventListener('mouseenter', playHover);   // survol = MÊME micro-click que les items du menu
        card.addEventListener('pointerdown', () => playClick());   // bruit de click au toucher (comme dans le menu)
        card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); } });   // clavier -> ouvre Statistiques
        const el = card.querySelector('[data-count]'); if (!el) return;
        const target = +el.dataset.count || 0, suf = el.dataset.suffix || '';
        if (rm) { el.textContent = vitalFmt(target) + suf; return; }   // a11y : pas d'animation
        const DUR = 1100, start = performance.now() + i * 120;   // léger décalage entre les cartes
        el.textContent = vitalFmt(0) + suf;
        setTimeout(() => playCountTicks(DUR), i * 120);   // bruit de comptage synchronisé au chiffre qui monte
        const tick = (now) => {
          if (now < start) return requestAnimationFrame(tick);
          const p = Math.min(1, (now - start) / DUR);
          const e = 1 - Math.pow(1 - p, 3);   // ease-out : rapide puis ralentit à l'approche
          el.textContent = vitalFmt(Math.round(target * e)) + suf;
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }

    /* ===== SFX du menu (Web Audio synthétisé, aucun fichier) =====
       UN SEUL AudioContext réutilisé (le code d'origine en créait un par clic -> plante
       après ~6 bascules : "number of hardware contexts reached the maximum").
       + baseline mobile : déverrouillage iOS au 1er geste, compresseur, gain boosté sur mobile. */
    let _actx = null, _master = null, _ready = false;
    let _muted = (() => { try { return localStorage.getItem('boussole:muted') === '1'; } catch (e) { return false; } })();   // état "Mute" persisté
    let _charge = null;   // "Electric Charge" de survol en cours (un seul à la fois = polyphonie maîtrisée)
    const _mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || matchMedia('(pointer: coarse)').matches;
    function audioCtx() {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      if (!_actx) {
        _actx = new AC();
        _master = _actx.createGain();
        _master.gain.value = _mobile ? 1.8 : 1;   // mobile boosté (25% seul = inaudible sur iPhone/Android)
        const comp = _actx.createDynamicsCompressor();
        comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 10; comp.attack.value = 0.003; comp.release.value = 0.2;
        _master.connect(comp); comp.connect(_actx.destination);
        // ---- « la pièce » : écho court discret partagé par TOUS les sons -> cohérence premium
        const dly = _actx.createDelay(0.4); dly.delayTime.value = 0.125;

        const wet = _actx.createGain(); wet.gain.value = _mobile ? 0.09 : 0.13;
        _master.connect(dly); dly.connect(damp); damp.connect(fb); fb.connect(dly); damp.connect(wet); wet.connect(comp);

    }

    const playMenuSound = (isOpen) => {

        const t = ctx.currentTime;

    // ===== SFX boutons : hover (micro-click aigu 0.03s, 15%) + click (double bip ascendant) =====
    const _hoverCapable = matchMedia('(hover: hover) and (pointer: fine)').matches;

    // ===== Étape 8 : audio-haptique des mastodontes (Cyber-Organic = synthé pur + bruit électrique granuleux) =====
    function startCharge() {   // SURVOL "Electric Charge" : bzz cristallin sous tension, coupable au mouseleave
      if (_muted) return;
      stopCharge();            // un seul charge à la fois
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime, DUR = 0.14;
      const out = ctx.createGain();
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(0.032, t + 0.02);   // "bzz" (~50 ms d'attaque)
      out.gain.exponentialRampToValueAtTime(0.0001, t + DUR);
      out.connect(_master);
      const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.setValueAtTime(3200, t);
      const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 70;                 // FM = shimmer électrique
      const lfoG = ctx.createGain(); lfoG.gain.value = 140; lfo.connect(lfoG); lfoG.connect(osc.frequency);
      osc.connect(out);
      const nb = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * DUR), ctx.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource(); noise.buffer = nb;                                        // grain organique
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 4300; bp.Q.value = 7;
      const ng = ctx.createGain(); ng.gain.value = 0.4;

      osc.stop(t + DUR + 0.02); lfo.stop(t + DUR + 0.02); noise.stop(t + DUR + 0.02);

    function stopCharge() {   // coupe le "bzz" INSTANTANÉMENT (mouseleave)

        c.out.gain.cancelScheduledValues(t);
        c.out.gain.setTargetAtTime(0.0001, t, 0.008);   // ~25 ms
        c.nodes.forEach((n) => { try { n.stop(t + 0.06); } catch (e) {} });
      } catch (e) {}
    }
    function playSell() {   // CLIC VENDRE : CARILLON DORÉ — cloche accordée (4 partiels détunés) + poussière d'or qui s'éteint
      if (_muted) return;

      const t = ctx.currentTime;
      const bus = ctx.createGain(); bus.connect(_master);
      // partiels d'une vraie cloche (fondamentale + tierce + octave + brillance), micro-détune = vie
      [[880, 0, 0.14, 0.55], [1318.5, 0.012, 0.1, 0.45], [1760, 0.03, 0.065, 0.34], [2637, 0.05, 0.032, 0.24]].forEach((p) => {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(p[0] * (1 + (Math.random() - 0.5) * 0.004), t + p[1]);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t + p[1]);
        g.gain.exponentialRampToValueAtTime(p[2], t + p[1] + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + p[1] + p[3]);
        o.connect(g); g.connect(bus); o.start(t + p[1]); o.stop(t + p[1] + p[3] + 0.05);
      });

      const nb = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.18), ctx.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const noise = ctx.createBufferSource(); noise.buffer = nb;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5800;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0.05, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      noise.connect(hp); hp.connect(ng); ng.connect(bus); noise.start(t); noise.stop(t + 0.2);
    }
    function playCoin() {   // tintement de pièce : deux micro-partiels très hauts, détunés (pour les pluies de pièces)
      if (_muted) return;
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime;
      [[3520, 0, 0.045], [4698, 0.018, 0.03]].forEach((p) => {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(p[0] * (1 + (Math.random() - 0.5) * 0.01), t + p[1]);
        const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t + p[1]);
        g.gain.exponentialRampToValueAtTime(p[2], t + p[1] + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + p[1] + 0.11);
        o.connect(g); g.connect(_master); o.start(t + p[1]); o.stop(t + p[1] + 0.14);
      });
    }
    function playSpend() {   // CLIC DÉPENSER "Impact/Discharge" : basse électrique lourde
      if (_muted) return;
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime;
      const bus = ctx.createGain(); bus.connect(_master);
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(58, t + 0.18);        // chute de fréquence = impact
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(200, t + 0.2);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.11, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(lp); lp.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.3);
      const nb = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.2), ctx.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource(); noise.buffer = nb;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;                        // décharge granuleuse
      bp.frequency.setValueAtTime(1200, t); bp.frequency.exponentialRampToValueAtTime(300, t + 0.18);
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0.07, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);

    // ===== Profil sonore PROPRE à "Statistiques" (données pures) =====
    function playDataScan() {   // SURVOL "Data Processing" : crépitement numérique léger et fluide (calcul de données)
      if (_muted || !_hoverCapable) return;
      const now = performance.now(); if (now - _lastHover < 45) return; _lastHover = now;   // partage l'anti-mitraillette du survol
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime, DUR = 0.11;
      // grains épars (bits de données) filtrés + balayage montant = "traitement en cours"
      const nb = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * DUR), ctx.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() < 0.5 ? Math.random() * 2 - 1 : 0);
      const noise = ctx.createBufferSource(); noise.buffer = nb;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6;
      bp.frequency.setValueAtTime(2600, t); bp.frequency.exponentialRampToValueAtTime(5200, t + DUR);   // balayage montant
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;              // léger / aérien
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + DUR);
      noise.connect(bp); bp.connect(hp); hp.connect(g); g.connect(_master); noise.start(t); noise.stop(t + DUR + 0.02);
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(5200, t); o.frequency.linearRampToValueAtTime(6400, t + DUR);   // scintillement cristallin par-dessus
      const og = ctx.createGain(); og.gain.setValueAtTime(0.02, t); og.gain.exponentialRampToValueAtTime(0.0001, t + DUR * 0.85);
      o.connect(og); og.connect(_master); o.start(t); o.stop(t + DUR);
    }
    function playAnalyticValidate() {   // CLIC "Validation Analytique" : bip résonnant, clair, technologique, apaisant — sinus purs = SANS distorsion
      if (_muted) return;
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime;
      const bus = ctx.createGain(); bus.gain.value = 0.9; bus.connect(_master);
      const delay = ctx.createDelay(); delay.delayTime.value = 0.055;   // légère résonance "tech" (queue maîtrisée, pas de boucle folle)
      const fb = ctx.createGain(); fb.gain.value = 0.25; const wet = ctx.createGain(); wet.gain.value = 0.4;
      delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(bus);
      const tone = (freq, dt, dur, peak) => {                          // sinus pur = zéro distorsion, attaque/chute douces = zéro clic
        const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t + dt);
        const gg = ctx.createGain();
        gg.gain.setValueAtTime(0.0001, t + dt);
        gg.gain.exponentialRampToValueAtTime(peak, t + dt + 0.02);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + dt + dur);
        osc.connect(gg); gg.connect(bus); gg.connect(delay); osc.start(t + dt); osc.stop(t + dt + dur + 0.02);
      };
      tone(784, 0,    0.5,  0.09);    // Sol (fondamentale)
      tone(1176, 0.03, 0.5,  0.055);  // quinte juste (784 x 1.5) = accord consonant
      tone(1568, 0.06, 0.42, 0.03);   // octave (scintillement discret)
    }

    // ===== Son de comptage des chiffres (Accueil) =====
    function playCountTicks(duration) {   // "comptage de chiffres" : ticks numériques rapides pendant la montée + petit ding de fin
      if (_muted) return;
      const ctx = audioCtx(); if (!ctx) return;
      const t0 = ctx.currentTime, dsec = (duration || 1100) / 1000;
      const N = Math.min(26, Math.max(10, Math.round(dsec / 0.045)));
      for (let k = 0; k < N; k++) {
        const tt = t0 + (k / N) * dsec;
        const o = ctx.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(2000 + Math.random() * 900, tt);
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.02, tt); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.016);
        o.connect(hp); hp.connect(g); g.connect(_master); o.start(tt); o.stop(tt + 0.018);
      }
      const tc = t0 + dsec;   // petit "ding" doux quand le compteur se pose
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(1320, tc); o.frequency.exponentialRampToValueAtTime(1760, tc + 0.05);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, tc); g.gain.exponentialRampToValueAtTime(0.06, tc + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, tc + 0.18);
      o.connect(g); g.connect(_master); o.start(tc); o.stop(tc + 0.2);
    }

    // ===== Sons du NEXUS (Accueil) : whoosh au survol + vacuum pop au clic (synthèse Web Audio) =====
    function playDigitalWhoosh() {   // "whoosh_digital" : souffle d'air synthétique court et PROPRE (survol de l'item Accueil)
      if (_muted || !_hoverCapable) return;
      const now = performance.now(); if (now - _lastHover < 45) return; _lastHover = now;   // anti-mitraillette (partagé avec le survol)
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime, DUR = 0.16;
      const nb = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * DUR), ctx.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = nb;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;   // filtre serré = souffle propre (pas granuleux)
      bp.frequency.setValueAtTime(700, t); bp.frequency.exponentialRampToValueAtTime(3600, t + DUR * 0.5); bp.frequency.exponentialRampToValueAtTime(1200, t + DUR);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + DUR);
      src.connect(bp); bp.connect(g); g.connect(_master); src.start(t); src.stop(t + DUR + 0.02);

    function playVacuumPop() {   // "vacuum_pop" : pop sous vide, ÉTOUFFÉ (passe-bas) et NET (clic sur l'item Accueil = portail)
      if (_muted) return;
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime;
      const bus = ctx.createGain(); bus.connect(_master);
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.09);   // chute rapide = "pop"
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(500, t + 0.1);   // étouffé
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(lp); lp.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.13);
      const nb = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.06), ctx.sampleRate);   // souffle d'aspiration très court (sous vide)
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const nz = ctx.createBufferSource(); nz.buffer = nb;
      const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 800;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0.05, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);

    // ===== Sons du COFFRE/TIROIR (Catalogue) : loquet au survol + tiroir lourd + double clac au clic =====
    function playGearLock() {   // "gear_lock_short" : loquet mécanique léger (deux petits clics métalliques)
      if (_muted || !_hoverCapable) return;
      const now = performance.now(); if (now - _lastHover < 45) return; _lastHover = now;
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime;
      const clack = (dt, f, amp) => {
        const nb = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.02), ctx.sampleRate);
        const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const nz = ctx.createBufferSource(); nz.buffer = nb;
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;   // sec, métallique
        const ng = ctx.createGain(); ng.gain.setValueAtTime(amp, t + dt); ng.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.02);
        nz.connect(hp); hp.connect(ng); ng.connect(_master); nz.start(t + dt); nz.stop(t + dt + 0.025);
        const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(f, t + dt);
        const og = ctx.createGain(); og.gain.setValueAtTime(amp * 0.5, t + dt); og.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.03);
        o.connect(og); og.connect(_master); o.start(t + dt); o.stop(t + dt + 0.035);
      };
      clack(0, 2600, 0.045); clack(0.05, 3200, 0.03);   // loquet à deux temps
    }
    function playDrawerPull() {   // "heavy_drawer_pull" (glissement lourd sur rail) + "metal_latch_snap" (double clac sec à l'arrivée)
      if (_muted) return;
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime, SLIDE = 0.34;
      const nb = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * SLIDE), ctx.sampleRate);   // rail lourd : bruit passe-bande grave qui roule
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const nz = ctx.createBufferSource(); nz.buffer = nb;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7;
      bp.frequency.setValueAtTime(320, t); bp.frequency.linearRampToValueAtTime(180, t + SLIDE);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 0.06); g.gain.setValueAtTime(0.07, t + SLIDE - 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + SLIDE);
      nz.connect(bp); bp.connect(g); g.connect(_master); nz.start(t); nz.stop(t + SLIDE + 0.02);
      const o = ctx.createOscillator(); o.type = 'sine';   // sous-grave = le poids du tiroir
      o.frequency.setValueAtTime(70, t); o.frequency.linearRampToValueAtTime(48, t + SLIDE);
      const og = ctx.createGain(); og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.05, t + 0.08); og.gain.exponentialRampToValueAtTime(0.0001, t + SLIDE);
      o.connect(og); og.connect(_master); o.start(t); o.stop(t + SLIDE + 0.02);
      const snap = (dt, f) => {   // clac métallique sec (enclenchement)
        const nb2 = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.03), ctx.sampleRate);
        const d2 = nb2.getChannelData(0); for (let i = 0; i < d2.length; i++) d2[i] = Math.random() * 2 - 1;
        const s = ctx.createBufferSource(); s.buffer = nb2;
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
        const sg = ctx.createGain(); sg.gain.setValueAtTime(0.11, t + dt); sg.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.03);
        s.connect(hp); hp.connect(sg); sg.connect(_master); s.start(t + dt); s.stop(t + dt + 0.035);
        const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.setValueAtTime(f, t + dt); o2.frequency.exponentialRampToValueAtTime(f * 0.5, t + dt + 0.04);
        const og2 = ctx.createGain(); og2.gain.setValueAtTime(0.08, t + dt); og2.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.05);
        o2.connect(og2); og2.connect(_master); o2.start(t + dt); o2.stop(t + dt + 0.06);
      };
      snap(SLIDE, 900); snap(SLIDE + 0.07, 700);   // double clac « clac-clac »
    }

    // ===== NEXUS : attraction magnétique 3D de l'item « Accueil » (retour au centre de commande) =====
    function bindNexusMagnet() {
      const item = drawer.querySelector('.navbtn[data-nav="accueil"]'); if (!item) return;
      if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;   // souris uniquement
      const rmot = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let raf = 0;
      const move = (e) => {
        const r = item.getBoundingClientRect();
        const ry = ((e.clientX - r.left) / r.width - 0.5) * 16;    // rotateY : penche vers le curseur (gauche/droite)
        const rx = (0.5 - (e.clientY - r.top) / r.height) * 12;    // rotateX : penche vers le curseur (haut/bas)
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          item.style.transition = 'none';
          item.style.transform = 'perspective(500px) rotateX(' + rx.toFixed(1) + 'deg) rotateY(' + ry.toFixed(1) + 'deg) scale(1.05)';
        });
      };
      item.addEventListener('pointerenter', () => item.classList.add('nexus-hot'));   // glow cyan stable
      item.addEventListener('pointerleave', () => {
        item.classList.remove('nexus-hot');
        if (raf) cancelAnimationFrame(raf); raf = 0;
        item.style.transition = 'transform 300ms cubic-bezier(0.25, 1, 0.5, 1)';   // retour fluide à l'état initial
        item.style.transform = '';
      });
      if (!rmot) item.addEventListener('pointermove', move);
    }
    bindNexusMagnet();

    // ===== Profil dynamique (Supabase si session, sinon démo) =====
    const CROWN = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 8.5l3.8 3L12 5l4.7 6.5 3.8-3L18.5 19h-13z"/></svg>';
    const USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>';

      // le flash néon (glitch + snap) est déclenché au pointerdown, voir plus bas
      if (b.dataset.logout !== undefined) { setTimeout(doLogout, 220); return; }
      if (b.dataset.go) { setActiveNav(b.dataset.go); showSection(b.dataset.go, false); setTimeout(closeMenu, 220); return; }   // Paramètres (pied du tiroir)
      if (b.dataset.nav) { setActiveNav(b.dataset.nav); showSection(b.dataset.nav, false); }   // HUD : l'écran change instantanément (caméra sèche)
      setTimeout(closeMenu, 220);                       // laisse le temps de VOIR le clic "Miles" (~200 ms) avant de fermer
    });
  </script>
</body>
</html>
